<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f0b">
<title>BOOTSTRAP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#0b0f0b; --panel:#121a13; --panel2:#18231a; --line:#2a3b2c;
  --fg:#cfeccb; --dim:#7f9c80; --acc:#7dff8a; --amber:#ffb84d; --red:#ff6b6b; --blue:#7cc4ff;
  color-scheme: dark;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:#1f4a25;border-color:#3d8a47;color:#eaffea;font-weight:700}
button.amb{background:#4a3410;border-color:#8a6420;color:#ffe7bf}
code,.mono{font-family:var(--mono)}
#app{max-width:780px;margin:0 auto;padding-block:0 calc(16px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;display:flex;align-items:center;gap:8px;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .ttl{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{padding:6px 10px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:15px;color:var(--acc)}
details.card>summary{cursor:pointer;font-weight:700;color:var(--acc);list-style:none}
details.card>summary::before{content:"▸ ";}
details.card[open]>summary::before{content:"▾ ";}
.story{color:var(--dim);font-size:14px;border-left:3px solid var(--line);padding-left:10px;margin:8px 0}
.task{margin:8px 0}
.hint{margin-top:8px;font-size:14px}
.hint summary{color:var(--amber);cursor:pointer}
.learn{margin-top:10px;font-size:14px;background:#0e1a1f;border:1px solid #23404c;border-radius:8px;padding:8px 10px}
.learn summary{color:var(--blue);cursor:pointer;font-weight:700}
.learn p{margin:6px 0}
.learn ul{margin:6px 0;padding-left:1.3em}
.learn table{border-collapse:collapse;font-size:13px;margin:6px 0}
.learn td,.learn th{border:1px solid #23404c;padding:3px 7px;text-align:center}
.learn th{color:var(--dim);font-weight:400}
.learn pre{font-family:var(--mono);font-size:13px;background:#0b1316;border-radius:6px;padding:6px 8px;margin:6px 0;overflow-x:auto}
.learn code,.task code,.hint code{font-family:var(--mono);color:var(--amber)}
small,.dim{color:var(--dim)}
/* title */
.title{padding:48px 4px 24px;text-align:center}
.title h1{font-family:var(--mono);font-size:clamp(34px,10vw,64px);letter-spacing:.08em;margin:0;color:var(--acc);text-shadow:0 0 18px #2dff4a55}
.title .sub{color:var(--amber);margin-top:4px}
.prose{text-align:left;max-width:560px;margin:24px auto;color:var(--fg)}
.prose p{margin:0 0 12px}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--acc);vertical-align:-3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* ラベル翻訳機の完成図 */
.bp{border:1px solid var(--line);border-radius:10px;padding:10px;background:#0e150f;font-size:13px;margin:8px 0}
.bp summary{cursor:pointer;color:var(--amber);font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
.bp summary::-webkit-details-marker{display:none}
.bp .bpt::before{content:"▸ "}
.bp[open] .bpt::before{content:"▾ "}
.bp-body{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.bp-io{font-family:var(--mono);color:var(--dim);font-size:12px;word-break:break-all}
.bp-io b{color:var(--fg);font-weight:400}
.bp-ar{text-align:center;color:var(--dim);line-height:1;font-size:12px}
.bp-p{border:1px dashed #2a3b2c;border-radius:7px;padding:5px 8px;color:#5d7a62;line-height:1.4}
.bp-p .n{font-family:var(--mono);font-size:11px;margin-right:4px}
.bp-p.on{border:1px solid #3d8a47;color:var(--fg);background:#13261a}
.bp-p.on .n::after{content:" ✓";color:var(--acc)}
.bp-p.new{border-color:var(--amber);box-shadow:0 0 0 2px #ffb84d55;animation:bpop .7s ease-out}
.bp-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bp-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.bp-base{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bp-lbl{color:var(--dim);font-size:12px;margin-top:6px}
@keyframes bpop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:none}}
@media (prefers-reduced-motion: reduce){.bp-p.new{animation:none}}
/* map */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.stage.locked{opacity:.55}
.stage h2{margin:0;font-size:17px}
.stage .lang{font-family:var(--mono);color:var(--amber);font-size:13px}
.stage p{margin:6px 0 10px;font-size:14px;color:var(--dim)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.plist button{text-align:left;padding:10px}
.plist button .n{font-family:var(--mono);color:var(--dim);font-size:12px;display:block}
.plist button.done{border-color:#3d8a47}
.plist button.done .n::after{content:" ✓";color:var(--acc)}
.plist button.big{grid-column:1/-1;border-color:#8a6420}
/* grid */
.grid{display:grid;grid-template-columns:2.4em repeat(8,1fr);gap:3px;font-family:var(--mono);font-size:16px;user-select:none;-webkit-user-select:none}
.grid .ad{color:var(--dim);font-size:11px;align-self:center}
.grid .c{background:#0e150f;border:1px solid #1f2c21;border-radius:5px;text-align:center;padding:7px 0;min-height:36px;cursor:pointer}
.grid .c.e{color:#33463a}
.grid .c.cur{outline:2px solid var(--amber);outline-offset:-1px;background:#2a2210}
.grid .c.pc{background:#1d4a24;color:#fff}
.grid .c.arg{background:#173520}
.grid .c.cur.pc{background:#3d4a10}
.grid.ro .c{cursor:default}
.grid .c{position:relative}
.grid .c.tgt{outline:2px dashed var(--blue);outline-offset:-2px}
.grid .c.miss{outline:2px dashed var(--red);outline-offset:-2px;color:var(--red)}
.grid .c.lb::before{content:attr(data-l);position:absolute;left:2px;top:0;font-size:9px;line-height:1.1;color:var(--blue)}
.grid .gap{grid-column:1/-1;text-align:center;color:var(--dim);font-size:12px;border:1px dashed #1f2c21;border-radius:5px;padding:3px;cursor:pointer}
.grid.ro .gap{cursor:default}
.grid .c.nt::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--amber)}
.notes{margin-top:8px;font-size:13px}
.notes .nhead{color:var(--dim);font-size:12px}
.nitem{padding:3px 6px;border-radius:5px;cursor:pointer}
.nitem b{font-family:var(--mono);color:var(--amber);font-weight:400;margin-right:4px}
.nitem.on{background:#2a2210}
.info{font-family:var(--mono);font-size:13px;color:var(--blue);margin-top:8px;min-height:1.6em;word-break:break-all}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tools button{font-size:13px;padding:6px 9px}
.ed{position:relative;background:#0e150f;border:1px solid var(--line);border-radius:8px}
.ed-bg{position:absolute;inset:0;margin:0;padding:10px;font:15px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:transparent;pointer-events:none;overflow:hidden}
.ed-bg .xl{background:#173520;border-radius:3px}
.ed-bg .xo{background:#2f7a3a;border-radius:3px}
.ed-bg .xa{background:#245a2e;border-radius:3px}
.ed textarea.src{position:relative;background:transparent;border:0;white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden;resize:none;display:block;caret-color:var(--amber)}
.lkeys{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.lkeys button{padding:9px 0;font:600 16px var(--mono)}
.lkeys.abc{grid-template-columns:repeat(7,1fr)}
.lrow{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:5px}
.lrow button{padding:9px 0;font:600 15px var(--mono)}
.iline.sel{background:#2a2210}
textarea.src{width:100%;min-height:260px;background:#0e150f;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:15px/1.5 var(--mono);resize:vertical}
/* tests */
.tests{display:flex;flex-direction:column;gap:6px}
.test{font-family:var(--mono);font-size:13px;background:#0e150f;border:1px solid #1f2c21;border-radius:8px;padding:6px 8px;cursor:pointer;word-break:break-all}
.test.sel{border-color:var(--amber)}
.test .k{color:var(--dim)}
.test.ok{border-left:4px solid var(--acc)}
.test.ng{border-left:4px solid var(--red)}
/* machine */
.regs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-family:var(--mono);font-size:13px}
.regs div{background:#0e150f;border:1px solid #1f2c21;border-radius:6px;padding:4px 6px}
.regs b{color:var(--acc);font-weight:400}
.strip{font-family:var(--mono);font-size:13px;background:#0e150f;border:1px solid #1f2c21;border-radius:6px;padding:6px;margin-top:6px;word-break:break-all;line-height:1.9}
.strip .lbl{color:var(--dim);margin-right:6px}
.strip span.t{display:inline-block;min-width:1.6em;text-align:center;border-radius:3px}
.strip span.now{background:var(--amber);color:#000}
.strip span.bad{background:var(--red);color:#000}
.strip span.used{color:#4b6450}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.ctrl button{flex:1;min-width:60px;white-space:nowrap;padding:8px 4px;font-size:14px}
.msg{font-size:14px;margin-top:6px}
.msg.err{color:var(--red)}
.msg.ok{color:var(--acc)}
.msg.warn{color:var(--amber)}
/* keypad */
.pad{position:sticky;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));margin-top:12px}
.keys{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.keys button{padding:10px 0;font:600 17px var(--mono)}
.keys2{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:5px}
.keys2 button{padding:9px 0;font-size:13px}
.keys2 button.pri{font-size:14px}
.ktool{display:flex;gap:5px}
.ktool button{flex:1;font:600 16px var(--mono);padding:9px 0}
.ktool button.pri{flex:2;font:700 15px system-ui,sans-serif}
/* modal */
.ov{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:600px;width:100%;max-height:88vh;overflow:auto}
.modal h2{margin:0 0 8px;color:var(--acc);font-size:19px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
table.ops{border-collapse:collapse;width:100%;font-size:13px}
table.ops td,table.ops th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
table.ops td:first-child{font-family:var(--mono);color:var(--amber);white-space:nowrap}
table.ops td:nth-child(2){font-family:var(--mono);white-space:nowrap}
table.ops th{color:var(--dim);font-weight:400}
.unlock{font-family:var(--mono);color:var(--amber);font-size:20px;text-align:center;margin:12px 0;letter-spacing:.05em}
.stats{font-family:var(--mono);color:var(--blue)}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= 機械 SEED-8 ================= */
const hex2 = n => (n & 255).toString(16).toUpperCase().padStart(2, '0');
const str = s => Array.from(s).map(c => c.charCodeAt(0));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const OPS = [
  [0x00,'HLT',0,'停止する'],
  [0x01,'IN', 0,'テープから1文字読んで A へ（テープの終わりなら 00）'],
  [0x02,'OUT',0,'A を出力する'],
  [0x03,'RWD',0,'テープを先頭に巻き戻す'],
  [0x04,'TAX',0,'X ← A'],
  [0x05,'TXA',0,'A ← X'],
  [0x06,'INX',0,'X ← X+1'],
  [0x07,'DEX',0,'X ← X−1'],
  [0x10,'LDI',1,'A ← nn（数そのもの）'],
  [0x11,'LD', 1,'A ← メモリ[nn]'],
  [0x12,'ST', 1,'メモリ[nn] ← A'],
  [0x13,'LDX',0,'A ← メモリ[X]'],
  [0x14,'STX',0,'メモリ[X] ← A'],
  [0x20,'ADI',1,'A ← A + nn'],
  [0x21,'ADD',1,'A ← A + メモリ[nn]'],
  [0x22,'SBI',1,'A ← A − nn'],
  [0x23,'SUB',1,'A ← A − メモリ[nn]'],
  [0x24,'SHL',0,'A ← A × 2'],
  [0x30,'JMP',1,'nn 番地へ跳ぶ'],
  [0x31,'JZ', 1,'A が 00 なら nn 番地へ跳ぶ'],
  [0x32,'JNZ',1,'A が 00 でなければ nn 番地へ跳ぶ'],
  [0x33,'JEQ',1,'直前の CMP が「等しい」なら nn へ跳ぶ'],
  [0x34,'JLT',1,'直前の CMP が「A の方が小さい」なら nn へ跳ぶ'],
  [0x35,'CALL',1,'戻り先を覚えてから nn へ跳ぶ（部品を呼ぶ）'],
  [0x36,'RET',0,'最後の CALL の次の命令へ戻る'],
  [0x40,'CMP',1,'A と nn を比べる（A は変わらない）'],
];
const OP = {}; OPS.forEach(o => OP[o[0]] = {code:o[0], m:o[1], arg:o[2], d:o[3]});

function newVM(bytes, tape){
  const mem = new Uint8Array(256);
  for (let i = 0; i < bytes.length && i < 256; i++) mem[i] = bytes[i];
  return {mem, pc:0, a:0, x:0, eq:false, lt:false, rs:[], tape:tape.slice(), tp:0, out:[], steps:0, halted:false, err:null};
}
function step(v){
  if (v.halted || v.err) return;
  const m = v.mem, op = m[v.pc], n = m[(v.pc + 1) & 255];
  const o = OP[op];
  if (!o){ v.err = `${hex2(v.pc)}番地の ${hex2(op)} は命令ではありません`; return; }
  let pc = (v.pc + 1 + o.arg) & 255;
  switch (op){
    case 0x00: v.halted = true; v.steps++; return;
    case 0x01: v.a = v.tp < v.tape.length ? v.tape[v.tp++] : 0; break;
    case 0x02: v.out.push(v.a); if (v.out.length > 3000) v.err = '出力が多すぎます'; break;
    case 0x03: v.tp = 0; break;
    case 0x04: v.x = v.a; break;
    case 0x05: v.a = v.x; break;
    case 0x06: v.x = (v.x + 1) & 255; break;
    case 0x07: v.x = (v.x - 1) & 255; break;
    case 0x10: v.a = n; break;
    case 0x11: v.a = m[n]; break;
    case 0x12: m[n] = v.a; break;
    case 0x13: v.a = m[v.x]; break;
    case 0x14: m[v.x] = v.a; break;
    case 0x20: v.a = (v.a + n) & 255; break;
    case 0x21: v.a = (v.a + m[n]) & 255; break;
    case 0x22: v.a = (v.a - n) & 255; break;
    case 0x23: v.a = (v.a - m[n]) & 255; break;
    case 0x24: v.a = (v.a << 1) & 255; break;
    case 0x30: pc = n; break;
    case 0x31: if (v.a === 0) pc = n; break;
    case 0x32: if (v.a !== 0) pc = n; break;
    case 0x33: if (v.eq) pc = n; break;
    case 0x34: if (v.lt) pc = n; break;
    case 0x35: if (v.rs.length >= 16){ v.err = 'CALL が深すぎます（RET せずに CALL を重ねていませんか？）'; return; } v.rs.push(pc); pc = n; break;
    case 0x36: if (!v.rs.length){ v.err = `${hex2(v.pc)}番地の RET：戻り先がありません（CALL されていないのに RET した）`; return; } pc = v.rs.pop(); break;
    case 0x40: v.eq = v.a === n; v.lt = v.a < n; break;
  }
  v.pc = pc; v.steps++;
}
function runVM(bytes, tape, limit){
  const v = newVM(bytes, tape);
  while (!v.halted && !v.err){
    if (v.steps >= limit){ v.err = `${limit}歩を超えても止まりません（無限ループ？）`; break; }
    step(v);
  }
  return v;
}

/* ============ ラベル付き16進：正しい翻訳（検査用） ============ */
// テープ仕様どおりの2パス翻訳（1-10 の期待値づくりと、翻訳機の答え合わせに使う）
function asmTape(s){
  const t = str(s), lab = {}, out = [];
  const hv = c => c >= 0x41 ? c - 0x37 : c - 0x30;
  for (let pass = 0; pass < 2; pass++){
    let pos = 0;
    for (let i = 0; i < t.length; i++){
      const c = t[i];
      if (c < 0x21) continue;
      if (c === 0x3A){ i++; if (!pass) lab[t[i]] = pos; continue; }
      if (c === 0x40){ i++; if (pass) out.push(lab[t[i]] ?? 0); pos++; continue; }
      if (pass) out.push(((hv(c) << 4) + hv(t[i + 1] ?? 0)) & 255);
      i++; pos++;
    }
  }
  return out;
}
// テープ中の :x が指す番地を、出てきた順に並べる（1-8 の期待値）
function labelPos(s){
  const t = str(s), out = []; let pos = 0;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (c < 0x21) continue;
    if (c === 0x3A){ i++; out.push(pos); continue; }
    i++; pos++;
  }
  return out;
}
// 第2段階のソースを点検し、翻訳機に通すテープを作る
function lint(src){
  const errors = [], toks = [];
  let off = 0;
  src.split('\n').forEach((line, li) => {
    const ln = li + 1, base = off; off += line.length + 1;
    const h = line.indexOf('#'); if (h >= 0) line = line.slice(0, h);
    for (let i = 0; i < line.length; i++){
      const c = line[i];
      if (c === ' ' || c === '\t' || c === '\r' || c === '　') continue;
      if (c === ':' || c === '@'){
        const l = line[i + 1];
        if (!l || !/[a-z]/.test(l)){ errors.push(`${ln}行目: '${c}' の直後にラベル名（a〜z の小文字1文字）が必要です`); continue; }
        if (line[i + 2] && /[0-9a-zA-Z]/.test(line[i + 2])) errors.push(`${ln}行目: ラベル名は1文字だけです（'${c}${l}${line[i+2]}…' の後に空白を）`);
        toks.push({t:c, l, ln, s:base + i, e:base + i + 2}); i++; continue;
      }
      if (/[0-9a-fA-F]/.test(c)){
        const d = line[i + 1];
        if (!d || !/[0-9a-fA-F]/.test(d)){ errors.push(`${ln}行目: 16進数は2桁ずつ書きます（'${c}' が1桁だけ）`); continue; }
        toks.push({t:'b', v:parseInt(c + d, 16), ln, s:base + i, e:base + i + 2}); i++; continue;
      }
      errors.push(`${ln}行目: 使えない文字 '${c}'`);
    }
  });
  const lab = {}; let pos = 0;
  toks.forEach(k => {
    k.addr = pos;
    if (k.t === ':'){ if (k.l in lab) errors.push(`${k.ln}行目: ラベル '${k.l}' が二度つけられています`); lab[k.l] = pos; }
    else pos++;
  });
  toks.forEach(k => { if (k.t === '@' && !(k.l in lab)) errors.push(`${k.ln}行目: ラベル '${k.l}' がどこにもありません`); });
  if (pos > 256) errors.push(`プログラムが ${pos} バイトあります（メモリは 256 バイト）`);
  const lines = []; let cur = [], curLn = toks.length ? toks[0].ln : 1;
  toks.forEach(k => { if (k.ln !== curLn){ lines.push(cur.join(' ')); cur = []; curLn = k.ln; } cur.push(k.t === 'b' ? hex2(k.v) : k.t + k.l); });

  hint:'<code>10 48</code> は「A に 48 を入れる」、<code>02</code> は「A を出力」、<code>00</code> は「停止」。最後の <code>00</code> の位置に何を足せばいいだろう？',
  prefill:[0x10,0x48,0x02,0x00],
  tests:[{tape:[], out:str('HI')}]},
 {id:'1-2', st:1, mode:'hex', title:'こだま',
  story:'テープ読み取り機が動いた。読んだものをそのまま返すだけの、最小のプログラムを書こう。',
  task:'テープの文字を、終わり（00）まで順に出力する。',
  learn:`<p><b>テープ</b>は機械の外にある入力用の紙で、256 バイトのメモリとは別の装置です。</p>
   <ul>
   <li><code>IN</code> を実行すると、読み取り位置の1文字が A に入り、<b>読み取り位置は自動で1つ進みます</b>。どこまで読んだかを数えたり、番地を足したりする必要はありません。</li>
   <li>後戻りはできません。できるのは <code>RWD</code> で先頭まで巻き戻すことだけです（1-10 で使います）。</li>
   <li>最後まで読んだ後の <code>IN</code> は <code>00</code> を返します。これで終わりを見分けます。</li>
   <li>テープに書かれた文字は、機械には<b>文字コード</b>（数）として届きます。たとえば A は <code>41</code>、B は <code>42</code>。</li>
   </ul>
   <p>下の「機械」欄では、オレンジの印が次に読む位置、■ がテープの終わりです。</p>`,
  hint:'IN → 00なら終わりへ（JZ）→ OUT → 先頭へ（JMP）。飛び先は「何番地か」を自分で数える。番地は表の左端と列から読める。',
  tests:[W('ABC'), W('BOOT'), W(''), W('Hello!')].map(t => ({...t, out:t.tape}))},
 {id:'1-3', st:1, mode:'hex', title:'足し算',
  story:'計算させてみよう。ただし A は1つしかない。覚えておきたい数はメモリにしまう。',
  task:'テープには数が2つずつ並ぶ。各組の和を出力する（256 以上は下2桁）。テープが終われば止まる。',
  hint:'1つ目を <code>ST 80</code>（12 80）で 80 番地にしまい、2つ目を読んで <code>ADD 80</code>（21 80）。プログラムが 80 番地まで届かないなら、そこは自由なメモ用紙だ。',
  tests:[{tape:[3,4],out:[7]},{tape:[1,2,10,20],out:[3,30]},{tape:[200,100],out:[44]},{tape:[],out:[]}]},
 {id:'1-4', st:1, mode:'hex', title:'挿入地獄',
  story:'昨日書いたカウントダウン（テープの数 n から 1 まで出力）が入っている。そこへ仕様変更が来た。途中に命令を差し込むと……後ろの番地が、全部ずれる。',
  task:'各数の後に <b>,</b>（2C）を、最後に <b>!</b>（21）を出力するように直す。例：3 → <code>03 2C 02 2C 01 2C 21</code>',
  hint:'「挿入」で 00 を差し込める。OUT のあとで「LDI 2C, OUT, LD 80」を差し込むと、A を取り戻せる。差し込んだ後ろを指していた飛び先（JZ の行き先）を数え直すのを忘れずに。',
  prefill:[0x01,0x12,0x80,0x11,0x80,0x31,0x0E,0x02,0x22,0x01,0x12,0x80,0x30,0x03,0x00],
  tests:[3,1,5].map(n => { const o = []; for (let i = n; i > 0; i--) o.push(i, 0x2C); o.push(0x21); return {tape:[n], out:o}; }),
  after:'番地を数え直すのは、人間の仕事ではない。……そう思ったなら、もう半分は分かっている。<br>それまでの知恵もある。昔のプログラマは、処理ごとに置き場所（区画）を先に決め、後で差し込めるよう間に余白を残しておいた。'},
 {id:'1-5', st:1, mode:'hex', title:'数字を読む',
  story:'16進を手で打ち込むのはもう限界だ。機械自身に「文字で書いた16進」を読ませたい。まずは1文字から。',
  task:'テープには文字 <code>0</code>〜<code>9</code>, <code>A</code>〜<code>F</code> が並ぶ。それぞれの値（00〜0F）を出力する。',
  learn:`<p><b>文字と数は別物</b>です。機械は文字を知らないので、人間が「どの文字を何番にするか」を表で決めました（ASCII）。人間がテープに「C」と書くと、機械に届くのは C の背番号 <code>43</code> です。</p>
   <p>一方、16進では C という記号は<b>数の 12</b> を表します（A=10, B=11, C=12 … F=15）。この課題では、文字「C」（背番号 <code>43</code>）を受け取ったら数の 12（2桁で <code>0C</code>）を出します。次の 1-6 で「4」「8」の2文字から本物のバイト <code>48</code> を組み立てるための部品です。</p>
   <table><tr><th>文字</th><th>背番号</th><th>表す数</th><th>差</th></tr>
   <tr><td>0</td><td>30</td><td>00</td><td>30</td></tr>
   <tr><td>7</td><td>37</td><td>07</td><td>30</td></tr>
   <tr><td>A</td><td>41</td><td>0A</td><td>37</td></tr>
   <tr><td>C</td><td>43</td><td>0C</td><td>37</td></tr>
   <tr><td>F</td><td>46</td><td>0F</td><td>37</td></tr></table>
   <p>数字どうし・英字どうしは背番号が連続しているので、差はいつも同じです。<b>数字は 30 を引き、英字は 37 を引けば</b>表す数になります。英字は 39 と 41 の間に <code>:</code> や <code>@</code> などの記号が挟まっているので、数字と同じ差では直りません。（文字「7」の背番号 <code>37</code> と、英字で引く <code>37</code> は偶然の一致です。）</p>
   <p><b>16進のまま 43 − 0C を計算するには</b>：16進は F の次で桁が上がり、<code>10</code>（10進の 16）になります。</p>
   <ul>
   <li><b>筆算</b>：下の桁 3 − C は引けないので、上の桁から1借りて <code>13</code>。C から <code>13</code> までは D, E, F, 10, 11, 12, 13 の 7歩なので 7。上の桁は 4 − 1 = 3。答え <code>37</code>。</li>
   <li><b>回り道</b>：<code>0C</code> は <code>10</code> より 4 少ないので、43 − 10 + 4 = 33 + 4 = <code>37</code>。</li>
   <li><b>A で考える</b>：差はどの英字でも同じなので、A（<code>41</code> → <code>0A</code>）だけ考えれば十分です。</li>
   </ul>`,
  hint:'"0" は 30、"9" は 39、"A" は 41、"F" は 46。<code>CMP 41</code> して <code>JLT</code> なら数字なので 30 を引く。そうでなければ 37 を引く。',
  tests:[W('0123456789ABCDEF'), W('C0DE'), W('7')].map(t => ({...t, out:t.tape.map(c => c >= 0x41 ? c - 0x37 : c - 0x30)}))},
 {id:'1-6', st:1, mode:'hex', title:'2文字で1バイト',
  story:'<code>4</code><code>8</code> という2つの文字を、本物のバイト 48 にする。これができれば、プログラムを「文字」で書けるようになる。そのために、機械に新しい命令が増えた。',
  task:'テープには16進の文字が2桁ずつ、区切りなしで並ぶ（例：<code>4849</code>）。2桁ずつを1バイトにして出力する（例：<code>48 49</code>）。',
  learn:`<p><b>2文字を1バイトに</b>：「4」「8」なら、上の桁の 4 を 16 倍して <code>40</code>、そこへ下の桁の 8 を足して <code>48</code>。16 倍は <code>SHL</code>（×2）を4回。</p>
   <p><b>部品（サブルーチン）</b>：文字を数に直す処理を、上の桁と下の桁で2回使う。同じものを2回書かずに済むよう、新しい命令が2つ増えた。</p>
   <ul>
   <li><code>35 nn</code> CALL … 「戻り先」（CALL の次の番地）を覚えてから、nn 番地へ跳ぶ</li>
   <li><code>36</code> RET … 覚えておいた戻り先へ戻る</li>
   </ul>
   <pre>（番地は一例）
03: 35 20   CALL 20  ─┐
05: 24      ← RET で   │
   ここへ戻る ───────┐  │
20: 40 41   部品 ←───┼─┘
    …               │
26: 36      RET ────┘</pre>
   <p><b>20 番地には、1-5 の変換を部品にしたものを用意してある</b>（A に入った文字を数に直して戻る）。00〜1F 番地に本体を<b>上書きで</b>打とう。「挿入」を使うと部品の位置がずれる。</p>
   <p><b>区画と余白</b>：「本体は 00 から、部品は 20 から」と、置き場所を先に決めておく。この置き場所を<b>区画</b>、間の 00 の並びを<b>余白</b>と呼ぶ。本体が育っても余白が残っているうちは部品の番地が変わらないので、<code>CALL 20</code> を直さずに済む。</p>
   <p>マスをタップすると、跳ぶ命令の行き先や、読み書きする番地が青い点線で光る。「メモ」で各バイトに注釈を残せる。</p>`,
  hint:'流れ：IN → 00 なら終わりへ → <code>CALL 20</code> → <code>SHL</code> を4回 → <code>ST 80</code> でしまう → IN → <code>CALL 20</code> → <code>ADD 80</code> → OUT → 先頭へ。',
  prefill:[...Array(0x20).fill(0), 0x40,0x41,0x34,0x27,0x22,0x37,0x36,0x22,0x30,0x36],
  prefillNotes:{0x00:'ここから本体を上書きで打つ', 0x20:'部品：A の文字を数に直して戻る', 0x22:'数字なら 27 へ', 0x24:'英字：37 を引く', 0x26:'英字はここで戻る', 0x27:'数字：30 を引く', 0x29:'数字はここで戻る'},
  tests:[W('4849'), W('4F4B21'), W('00FF7F10'), W('')].map(t => ({...t, out:asmTape(String.fromCharCode(...t.tape))}))},
 {id:'1-7', st:1, mode:'hex', title:'最初の翻訳機',
  story:'人間が読みやすいように、2桁ごとに空白や改行で区切りたい。区切りを読み飛ばせれば、それはもう「16進のソースを機械語に直す」最初の翻訳機だ。',
  task:'1-6 と同じだが、2桁の間に区切りの空白（20）・改行（0A）が入る。区切りは読み飛ばす。',
  learn:`<p><b>やることは1つ</b>：上の桁の文字を読んだら、変換に使う前に「区切りなら読み直す」を差し込む。区切りは2桁の<b>間</b>にしか入らないので、下の桁の前には要らない。</p>
   <p>空白（<code>20</code>）と改行（<code>0A</code>）はどちらも <code>21</code> より小さい。だから次の4バイトで「区切りなら読み直し」になる。</p>
   <pre>40 21   CMP 21
34 xx   JLT xx   ← xx は上の桁を読む IN の番地</pre>
   <p><b>どこに差し込むか</b>：上の桁を読む IN と「テープの終わり？」の判定が済んだ後、変換の CALL の前。書き方によって場所が変わる。</p>
   <ul>
   <li><code>IN → JZ 終わり → CALL …</code> と書いたなら、JZ の直後</li>
   <li><code>IN → JNZ 先 → HLT → 先：CALL …</code> と書いたなら、JNZ の行き先（CALL の手前）</li>
   </ul>
   <p><b>差し込んだ後の点検</b>（どの書き方でも同じ）：</p>
   <ul>
   <li>差し込んだ位置より<b>後ろ</b>を指す行き先（JMP・JZ・JNZ・CALL など）は、差し込んだバイト数だけずれる。直す。</li>
   <li>差し込んだ位置<b>そのもの、または前</b>を指す行き先は、そのままでいい（差し込んだ CMP や、その前の命令を指すことになる）。</li>
   <li>後ろにある部品も一緒にずれる。ここで<b>余白</b>（1-6 の区画の話）が効く。部品の手前の 00 を、差し込んだのと同じ数だけ「削除」すれば、部品は 20 番地の区画に戻る。</li>
   </ul>
   <p>跳ぶ命令のマスを1つずつタップしよう。行き先が青い点線で光る（空きなら赤）。光ったマスが本当に跳びたい命令か確かめる。</p>`,
  hint:'1-6 のコードを「読込」で持ってくる。上の桁の IN と終わりの判定の後、CALL の前に <code>40 21 34 xx</code>（xx はその IN の番地）を「挿入」で差し込む。そのあと跳ぶ命令を全部タップして、行き先がずれていないか確かめる。部品の手前の 00 を4つ削除すれば、部品は 20 番地に戻る。',
  after:'これで、16進を空白や改行で区切って書ける。……とはいえ、楽になったのは見た目だけだ。飛び先の番地は、相変わらず自分で数えている。次は、それを機械にやらせる。',
  tests:[W('48 49'), W('4F 4B\n21'), W('00FF7F 10'), W('')].map(t => ({...t, out:asmTape(String.fromCharCode(...t.tape))}))},
 {id:'1-8', st:1, mode:'hex', title:'番地を数える',
  story:'1-4 で味わった「途中に差し込むと、後ろの番地が全部ずれる」を、ここで終わらせる。飛び先を番地ではなく名前で書き、番地は機械に数えさせる。ここから3つの課題で、そのための翻訳機を作る。',
  task:`テープにはラベル付きのソースが並ぶ。<code>:x</code> が出てくるたびに、その名前が指す番地を出力する。<br>
   例：<code>01 31 :a 02 :b 00</code> → <code>02 03</code>`,
  learn:`<p><b>これから作るもの</b>：1-4 のカウントダウンを、名前（ラベル）を使って書くとこうなる。</p>
   <pre>01 12 80            n を読んでしまう
:l 11 80 31 @e      ループ：n が 0 なら e へ
02 10 2C 02         n と「,」を出す
11 80 22 01 12 80   n − 1
30 @l               ループへ
:e 10 21 02 00      「!」を出して停止</pre>
   <p><code>:l</code> は「ここに l という名前をつける」、<code>@e</code> は「e という名前の番地」。翻訳機がこれを読んで番地を数え、<code>@e</code> を <code>13</code>、<code>@l</code> を <code>03</code> に置き換えて、1-4 と同じ機械語にする。途中に命令を差し込んでも、もう一度翻訳すれば番地は自動で合う。</p>
   <p><b>道のり</b>（3つの課題で少しずつ作る）：</p>
   <ul>
   <li><b>1-8 番地を数える</b>：<code>:x</code> が何番地を指すかを数えて出す（いまの課題）</li>
   <li><b>1-9 名前を覚える</b>：数えた番地を名前ごとに覚え、<code>@x</code> を番地に置き換えて機械語を出す。ただし、すでに出てきた名前だけ</li>
   <li><b>1-10 ラベル翻訳機</b>：まだ出てきていない名前（上の例の <code>@e</code>）も扱う。完成すると第2段階に進み、それ以降はラベルで書いたプログラムを、あなたの翻訳機が機械語にする</li>
   </ul>
   <p><b>ラベルは場所を取らない。</b><code>:a</code> は1バイトも出力されない付箋で、「次に出てくるバイトの番地」に a という名前をつける。</p>
   <pre>ソース   01   31   :a   02   :b   00
番地     00   01        02        03
                   a ─┘      b ─┘</pre>
   <ul>
   <li>a = <code>02</code>（02 番地にあるバイト <code>02</code> のこと）、b = <code>03</code></li>
   <li>同じ場所に2枚貼れば同じ番地（<code>:b :c 05</code> なら b も c も 00）</li>
   <li>最後に貼れば「最後のバイトの次」の番地</li>
   </ul>
   <p><b>数え方</b>：機械語のバイトが1つ増えるたびに番地を1増やす。</p>
   <table><tr><th>テープ</th><th>文字数</th><th>バイト数</th></tr>
   <tr><td>区切り</td><td>1</td><td>0</td></tr>
   <tr><td><code>4F</code>（2桁の16進）</td><td>2</td><td>1</td></tr>
   <tr><td><code>@x</code></td><td>2</td><td>1</td></tr>
   <tr><td><code>:x</code></td><td>2</td><td>0</td></tr></table>
   <p>2桁の16進も <code>@x</code> も「2文字で1バイト」なので、この課題では区別しなくていい。<code>:</code>（<code>3A</code>）かどうかだけ分ければいい。番地は 80 番地に置いて数える（プログラムを置いていないメモリは最初から 00）。</p>
   <p><b>メモリ地図</b>：この翻訳機は 1-10 まで3回に分けて育てるので、処理ごとに置き場所（区画）を決めて書く。後の課題で増える処理のために、間を空けておく。そうすれば次の課題では、空けておいた場所を埋めるだけで済み、書いたところがずれない。初期状態には、区画の位置をメモした骨組みが入っている。</p>
   ` + mapFor(8) + `
   <p>どの区画も、終わったら「振り分けへ（08）」か「番地+1 へ（48）」のどちらかに跳ぶ。番地を数えるのは 48 の1か所だけ。00 の「開始」は機械が最初に動かす番地。振り分けは 08 に置くので、まずそこへ跳ぶ。</p>`,
  hint:'08 振り分け：IN → 終わりなら停止 → 区切りなら 08 へ → <code>:</code> なら 20 へ → それ以外は 30 へ。<br>20：名前を読み捨て、番地を <code>LD 80</code> して出力し、08 へ。<br>30：2文字目を読み捨てて 48 へ。<br>48：<code>LD 80</code> → <code>ADI 01</code> → <code>ST 80</code> → 08 へ。',
  prefill:SKEL8.b, prefillNotes:SKEL8.notes,
  tests:['01 31 :a 02 :b 00', ':s 10 48 02 :e 00', '30 @x 00 00 :x 10 @y :y 00', '10 48\n02 00', ':b :c 05 @c @b :d']
    .map(s => ({tape:str(s), out:labelPos(s)})), table:false},
 {id:'1-9', st:1, mode:'hex', title:'名前を覚える',
  story:'数えた番地を、名前と結びつけて覚えておく。覚えた名前を呼べば番地が返ってくる——これで「名前で跳ぶ」ができる。まずは、すでに出てきた名前だけを扱う。',
  task:`テープの仕様：
   <ul>
   <li>空白・改行（21 未満）は読み飛ばす</li>
   <li><code>:x</code> … 名前 x（1文字）を「次のバイトの番地」として覚える。バイトは出さない</li>
   <li><code>@x</code> … 名前 x の番地を1バイトとして出力する</li>
   <li>それ以外は2桁の16進 → 1バイト</li></ul>
   この課題の <code>@x</code> は、いつも<b>それより前で</b> <code>:x</code> された名前を指す。<br>
   例：<code>01 :l 02 30 @l</code> → <code>01 02 30 01</code>`,
  learn:`<p><b>名前の表</b>：名前の文字コードを、そのまま番地として使う。a は <code>61</code>、b は <code>62</code> … z は <code>7A</code>。<code>:a</code> なら 61 番地に、a が指す番地をしまっておく。</p>
   <p>ところが <code>ST nn</code> の nn は打ち込んだときに決まってしまい、名前によって変えられない。そこで <b>X</b> を使う。X に番地を入れておけば、<code>STX</code> / <code>LDX</code> は「X が指す番地」を読み書きする。</p>
   <pre>:a を読んだ（いまの番地が 05 のとき）
  IN     A = 61   （名前 a の文字コード）
  TAX    X = 61
  LD 80  A = 05   （いまの番地）
  STX    メモリ[61] = 05

@a を読んだ
  IN     A = 61
  TAX    X = 61
  LDX    A = メモリ[61] = 05
  OUT    05 を出力</pre>

 {id:'2-8', st:2, mode:'label', big:true, title:'アセンブラ',

function migrate(sv){
  sv = Object.assign({code:{}, solved:{}, notes:{}, translator:null}, sv);
  if (!sv.notes) sv.notes = {};
if (!sv.ver || sv.ver < 2){
  // 旧版の 1-6（区切り付き）は新しい 1-7 に、旧 1-7（ラベル翻訳機）は 1-8 に移す
  const c = sv.code, d = sv.solved;
  if ('1-7' in c){ c['1-8'] = c['1-7']; delete c['1-7']; }
  if (d['1-7']){ d['1-8'] = d['1-7']; delete d['1-7']; }
  if ('1-6' in c){ c['1-7'] = c['1-6'].slice(); if (!d['1-6']) delete c['1-6']; }
  if (d['1-6']) d['1-7'] = d['1-6'];
  sv.ver = 2;
}
if (sv.ver === 2){
  // ラベル翻訳機を 1-8 から 1-10 へ。クリア済みなら新しい 1-8・1-9 も通過扱い
  const c = sv.code, d = sv.solved, n = sv.notes;
  if ('1-8' in c){ c['1-10'] = c['1-8']; delete c['1-8']; }
  if ('1-8' in n){ n['1-10'] = n['1-8']; delete n['1-8']; }
  if (d['1-8']){ d['1-10'] = d['1-8']; delete d['1-8']; d['1-8'] = {size:0, steps:0}; d['1-9'] = {size:0, steps:0}; c['1-9'] = c['1-10'].slice(); }
  sv.ver = 3;
}
  return sv;
}

async function cloudWrite(){
  if (!CLOUD.ref) return;
  if (CLOUD.busy){ CLOUD.again = true; return; }
  CLOUD.busy = true;
  try { await CLOUD.ref.set({json:JSON.stringify(SAVE), t:SAVE.t || 0}); } catch(e){}
  CLOUD.busy = false;
  if (CLOUD.again){ CLOUD.again = false; cloudWrite(); }
}
async function cloudInit(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.collection('data/users/' + id).doc('save');
    const snap = await ref.get();
    CLOUD.ref = ref;
    let remote = null;
    if (snap.exists){ try { remote = migrate(JSON.parse(snap.data().json)); } catch(e){} }
    const useRemote = remote && (progress(remote) > progress(SAVE) || (progress(remote) === progress(SAVE) && (remote.t || 0) > (SAVE.t || 0)));
    if (useRemote){
      SAVE = remote;
      try { localStorage.setItem(KEY, JSON.stringify(SAVE)); } catch(e){}
      if (S.screen !== 'puzzle') render();
      else if (!document.querySelector('.ov')) { const id2 = S.p.id; go('puzzle', id2); }
    } else if (progress(SAVE) || remote) cloudWrite();

  } catch(e){}
}

function unlocked(p){
  if (!stageOpen(p.st)) return false;
  const same = P.filter(q => q.st === p.st);
  const i = same.indexOf(p);

}
function getNotes(p){
  const n = p.id in SAVE.notes ? SAVE.notes[p.id].slice() : (() => {
    const a = []; if (p.prefillNotes) for (const k in p.prefillNotes) a[+k] = p.prefillNotes[k]; return a; })();
  const len = getCode(p).length;
  for (let i = 0; i < len; i++) n[i] = n[i] || '';
  n.length = len; return n;
}
// 先頭から命令として読み下し、各バイトが「命令」か「その引数」かを決める
function decode(b){
  const r = []; let i = 0;
  while (i < b.length){ const o = OP[b[i]]; r[i] = {k:'op', at:i}; if (o && o.arg && i + 1 < b.length) r[i + 1] = {k:'arg', at:i}; i += 1 + (o ? o.arg : 0); }
  return r;
}
const JUMPS = [0x30,0x31,0x32,0x33,0x34,0x35], MEMS = {0x11:'読む', 0x12:'書く', 0x21:'読んで足す', 0x23:'読んで引く'};
function target(b, c){
  const r = decode(b)[c]; if (!r) return null;
  const op = b[r.at], n = b[r.at + 1];
  if (r.at + 1 >= b.length) return null;
  if (JUMPS.includes(op)) return {at:n, text:`${OP[op].m} の行き先 → ${hex2(n)}番地`};
  if (op in MEMS) return {at:n, text:`${hex2(n)}番地を${MEMS[op]}`};
  return null;
}
function getCode(p){
  if (p.id in SAVE.code) return SAVE.code[p.id];
  return p.mode === 'hex' ? (p.prefill || []).slice() : (p.prefill || '');
}

          <span class="n">${p.id}${p.big ? (p.id === END_ID ? '　★' : '　★翻訳機') : ''}</span>${ok ? p.title : '？？？'}</button>`; }).join('')}</div>` :
        (s.n === 2 ? '<p class="mono" style="color:var(--amber)">解放条件：1-10 ラベル翻訳機</p>' : s.n === 3 ? '<p class="mono" style="color:var(--amber)">解放条件：2-8 アセンブラ</p>' : '')}
    </div>`;
  }).join('') + `<p class="dim" style="font-size:12px;text-align:center">${CLOUD.ref ? '進み具合は claude.ai のあなたのアカウントにも保存されています（あなただけが読めます）。' : '進み具合はこの端末のブラウザに保存されます。消えることがあるので、ときどき引き継ぎコードを控えておくと安心です。'}</p>
  <p style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><button data-act="exp" style="font-size:12px;padding:4px 9px">引き継ぎコードを書き出す</button><button data-act="imp" style="font-size:12px;padding:4px 9px">読み込む</button><button data-act="wipe" style="font-size:12px;padding:4px 9px">最初から</button></p>`;
}

function curBytes(){
  const p = S.p;
  if (p.mode === 'hex') return getCode(p);

// 第2段階：プレイヤーの翻訳機で翻訳する
function build(src){
  const L = lint(src);
  if (L.errors.length) return {errors:L.errors, L};
  const v = runVM(SAVE.translator, str(L.tape), TR_LIMIT);
  if (v.err) return {errors:['あなたの翻訳機（1-10）が失敗しました：' + v.err]};
  const bytes = v.out.slice(0, 256);
  const diff = bytes.length !== L.bytes.length || bytes.some((b, i) => b !== L.bytes[i]);
  return {bytes, steps:v.steps, tape:L.tape, labels:L.labels, L,
    warn: diff ? 'あなたの翻訳機の出力が、仕様どおりの翻訳と食い違っています。このまま動かしますが、1-10 を見直した方がいいかもしれません。' : null};
}

function fmtBytes(a, max = 40){ if (!a.length) return '<span class="dim">（なし）</span>'; const s = a.slice(0, max).map(hex2).join(' '); return s + (a.length > max ? ' …' : ''); }

const chOf = c => c === 0x0A ? '↵' : c === 0x20 ? '␣' : c > 0x20 && c < 0x7F ? String.fromCharCode(c) : '·';

// メモリ全体（00〜FF）を8バイトずつの行で描く。何もない行が続くところは1行に畳む
function gridHTML(bytes, opt){
  const len = bytes.length;
  const pc = opt.vm ? opt.vm.pc : -1;
  const pcArg = opt.vm && OP[opt.vm.mem[pc]] && OP[opt.vm.mem[pc]].arg ? (pc + 1) & 255 : -1;
  const tg = opt.edit && opt.cur >= 0 ? target(bytes, opt.cur) : null;
  const nt = opt.notes || [];
  // コード中の命令が指している番地（跳び先・読み書き先）
  const refs = new Set(), miss = new Set(), dec = decode(bytes);
  dec.forEach((r, i) => { if (r && r.k === 'op' && i + 1 < len){
    const op = bytes[i], n = bytes[i + 1];
    if (JUMPS.includes(op)){ refs.add(n); if (n >= len) miss.add(n); }
    else if (op in MEMS) refs.add(n);
  }});
  const cell = i => {
    const v = opt.vm ? opt.vm.mem[i] : bytes[i];
    const filled = i < len || (opt.vm && v);
    let txt = filled || opt.vm ? hex2(v) : '··';
    let cls = 'c' + (filled ? '' : ' e');
    if (i === opt.cur){ cls += ' cur'; if (S.pend !== null) txt = S.pend + '_'; }
    if (tg && i === tg.at) cls += ' tgt';
    if (miss.has(i)) cls += ' miss';
    if (nt[i]) cls += ' nt';
    if (opt.vm && !opt.vm.halted){ if (i === pc) cls += ' pc'; else if (i === pcArg) cls += ' arg'; }
    const lb = opt.labels ? Object.keys(opt.labels).filter(k => opt.labels[k] === i) : [];
    if (lb.length) return `<div class="${cls} lb" data-l=":${lb.join(':')}">${txt}</div>`;
    return `<div class="${cls}" ${opt.edit ? `data-act="cell" data-i="${i}"` : ''}>${txt}</div>`;
  };
  const shown = r => {
    if (r < 4) return true;
    for (let i = r * 8; i < r * 8 + 8; i++)
      if (i <= len || i === opt.cur || refs.has(i) || (opt.labels && Object.values(opt.labels).includes(i)) || nt[i] || (opt.vm && (opt.vm.mem[i] || i === pc))) return true;
    return false;
  };
  let h = '', r = 0;
  while (r < 32){
    if (shown(r)){ h += `<div class="ad">${hex2(r * 8)}</div>`; for (let i = r * 8; i < r * 8 + 8; i++) h += cell(i); r++; continue; }
    const a = r; while (r < 32 && !shown(r)) r++;
    h += `<div class="gap" ${opt.edit ? `data-act="cell" data-i="${a * 8}"` : ''}>${hex2(a * 8)}〜${hex2(r * 8 - 1)}　空き（${(r - a) * 8}バイト）${opt.edit ? '　タップで開く' : ''}</div>`;
  }
  return `<div class="grid ${opt.edit ? '' : 'ro'}">${h}</div>`;
}
function drawGrid(){
  const el = document.getElementById('grid'); if (!el) return;
  el.innerHTML = gridHTML(getCode(S.p), {cur:S.cur, vm:S.vm && S.vm.steps ? S.vm : null, edit:true, notes:getNotes(S.p)});
  const nl = document.getElementById('notes'); if (!nl) return;
  const nt = getNotes(S.p), items = nt.map((t, i) => t ? `<div class="nitem ${i === S.cur ? 'on' : ''}" data-act="cell" data-i="${i}"><b>${hex2(i)}</b> ${esc(t)}</div>` : '').join('');

}

  const r = decode(b)[S.cur], o = OP[v], tg = target(b, S.cur), note = getNotes(S.p)[S.cur];
  let h = `[${hex2(S.cur)}] = ${hex2(v)}　`;

  else h += o ? `<b>${o.m}${o.arg ? ' nn' : ''}</b>：${o.d}` : '<span class="dim">命令ではない数（データなら可）</span>';
  if (tg) h += `<br><span style="color:var(--acc)">${tg.text}</span>` + (JUMPS.includes(b[r.at]) && tg.at >= b.length ? ' <span style="color:var(--red)">（空き！ここには何も書かれていない）</span>' : '');
  if (note) h += `<br><span style="color:var(--amber)">メモ：${esc(note)}</span>`;
  el.innerHTML = h;

/* ---------- 第2段階のソース編集：光る行・タップで中身・キーパッド ---------- */
function fitSrc(){ const ta = document.getElementById('src'); if (!ta) return; ta.style.height = 'auto'; ta.style.height = Math.max(260, ta.scrollHeight) + 'px'; drawSrcBg(); }
function curLint(){ if (!S.built) S.built = buildCur(); return S.built.L; }
// ソースの背景に、実行中の行と命令を描く
function drawSrcBg(){
  const bg = document.getElementById('srcbg'), ta = document.getElementById('src'); if (!bg || !ta) return;
  const src = ta.value, marks = [];
  const v = S.vm, L = curLint();
  if (v && v.steps && L && !L.errors.length){
    const op = L.toks.find(k => k.t !== ':' && k.addr === v.pc);
    if (op){
      const o = OP[v.mem[v.pc]];
      const arg = o && o.arg ? L.toks.find(k => k.t !== ':' && k.addr === ((v.pc + 1) & 255)) : null;
      const ls = src.lastIndexOf('\n', op.s - 1) + 1, le = src.indexOf('\n', op.s);
      marks.push({s:ls, e:le < 0 ? src.length : le, c:'xl'});
      marks.push({s:op.s, e:op.e, c:'xo'});
      if (arg) marks.push({s:arg.s, e:arg.e, c:'xa'});
    }
  }
  // 区切り位置ごとに、いちばん内側の印で塗る
  const cuts = [...new Set([0, src.length, ...marks.flatMap(m => [m.s, m.e])])].sort((a, b) => a - b);
  let h = '';
  for (let i = 0; i < cuts.length - 1; i++){
    const a = cuts[i], b = cuts[i + 1], m = marks.filter(m => m.s <= a && b <= m.e).pop();
    const t = esc(src.slice(a, b));
    h += m ? `<span class="${m.c}">${t}</span>` : t;
  }
  bg.innerHTML = h + '\n';
}
// カーソル（タップした所）の中身を説明する
function srcCaret(){
  const ta = document.getElementById('src'), el = document.getElementById('sinfo'); if (!ta || !el) return;
  S.caret = ta.selectionStart;
  const L = curLint(), c = S.caret;
  S.selAddr = -1;
  if (!L || L.errors.length){ el.innerHTML = '<span class="dim">翻訳できない状態なので、中身は表示できません。</span>'; drawBuilt(); return; }
  const k = L.toks.find(k => k.s <= c && c < k.e) || L.toks.find(k => k.e === c);
  if (!k){ el.innerHTML = '<span class="dim">数やラベルをタップすると、ここに中身が出ます。</span>'; drawBuilt(); return; }
  const b = L.bytes, at = labs => { const n = Object.keys(L.labels).filter(x => L.labels[x] === labs); return n.length ? `（<span style="color:var(--blue)">:${n.join(' :')}</span> の場所）` : ''; };
  let h = '';
  if (k.t === ':') h = `<b>:${k.l}</b>　ここに名前 ${k.l} をつける ＝ ${hex2(k.addr)}番地。バイトにはならない`;
  else {
    S.selAddr = k.addr;
    const r = decode(b)[k.addr], v = b[k.addr], o = OP[v], tg = target(b, k.addr);
    h = `[${hex2(k.addr)}] = ${hex2(v)}　`;
    if (k.t === '@') h += `<b>@${k.l}</b> → 名前 ${k.l} の番地 ${hex2(v)}　`;
    if (r && r.k === 'arg') h += `<b>${OP[b[r.at]].m}</b> の引数`;
    else if (k.t === 'm') h += `<b>${k.w}</b> → 番号 ${hex2(v)}：${o.d}`;
    else if (k.t === 'b') h += o ? `<b>${o.m}${o.arg ? ' nn' : ''}</b>：${o.d}` : '<span class="dim">命令ではない数</span>';
    if (tg) h += `<br><span style="color:var(--acc)">${tg.text}</span>${JUMPS.includes(b[r.at]) ? at(tg.at) : ''}`;
  }
  el.innerHTML = h;
  drawBuilt();
}
// キーパッド：0〜F と記号。: や @ を押すと名前（a〜z）の面に切り替わる
function drawLpad(){
  const el = document.getElementById('lpad'); if (!el) return;
  if (S.lpage === 'ops'){
    el.innerHTML = `<div class="lkeys" style="grid-template-columns:repeat(6,1fr)">${OPS.map(o => `<button data-act="lk" data-k="op:${o[1]}" style="font-size:13px">${o[1]}</button>`).join('')}<button data-act="lk" data-k="hex" style="grid-column:span 4;font-size:13px">0〜F に戻る</button></div>`;
  } else if (S.lpage === 'abc'){
    el.innerHTML = `<div class="lkeys abc">${'abcdefghijklmnopqrstuvwxyz'.split('').map(k => `<button data-act="lk" data-k="${k}">${k}</button>`).join('')}<button data-act="lk" data-k="hex" style="grid-column:span 2;font-size:13px">0〜F に戻る</button></div>`;
  } else {
    el.innerHTML = `<div class="lkeys">${'0123456789ABCDEF'.split('').map(k => `<button data-act="lk" data-k="${k}">${k}</button>`).join('')}</div>
      <div class="lrow"><button data-act="lk" data-k=":">:</button><button data-act="lk" data-k="@">@</button><button data-act="lk" data-k=" ">␣</button><button data-act="lk" data-k="\n">↵</button><button data-act="lk" data-k="bs">⌫</button><button data-act="lk" data-k="#">#</button></div>
      <div class="lrow" style="grid-template-columns:repeat(4,1fr) ${S.p.mode === 'asm' ? '1.4fr ' : ''}2fr"><button data-act="lk" data-k="left">◀</button><button data-act="lk" data-k="right">▶</button><button data-act="lk" data-k="up">▲</button><button data-act="lk" data-k="down">▼</button>${S.p.mode === 'asm' ? '<button data-act="lk" data-k="ops" style="font:600 13px system-ui,sans-serif">命令</button>' : ''}<button data-act="lk" data-k="kb" style="font:12px system-ui,sans-serif">${S.nativeKb ? '⌨ キーパッド' : '⌨ 文字'}</button></div>`;
  }
}
function lkey(k){
  const ta = document.getElementById('src'); if (!ta) return;
  let a = ta.selectionStart, b = ta.selectionEnd;
  const put = t => { ta.setRangeText(t, a, b, 'end'); a = b = ta.selectionStart; };
  if (k === 'hex'){ S.lpage = 'hex'; drawLpad(); return; }
  if (k === 'kb'){ S.nativeKb = !S.nativeKb; ta.inputMode = S.nativeKb ? 'text' : 'none'; drawLpad(); ta.blur(); ta.focus(); return; }
  const moveTo = n => { n = Math.max(0, Math.min(ta.value.length, n)); ta.setSelectionRange(n, n); ta.focus({preventScroll:true}); srcCaret(); };
  if (k === 'left' || k === 'right'){
    // 単語（空白で区切られたまとまり）ごとに動く。行の頭と終わりでも止まる
    const v = ta.value, stops = [0, v.length];
    for (let i = 1; i < v.length; i++){ if (/\S/.test(v[i]) && /\s/.test(v[i - 1])) stops.push(i); if (v[i] === '\n') stops.push(i); }
    const st = [...new Set(stops)].sort((x, y) => x - y);
    moveTo(k === 'left' ? (st.filter(x => x < a).pop() ?? 0) : (st.find(x => x > b) ?? v.length)); return;
  }
  if (k === 'up' || k === 'down'){
    const v = ta.value, ls = v.lastIndexOf('\n', a - 1) + 1, col = a - ls;
    if (k === 'up'){ if (ls === 0) return moveTo(0); const ps = v.lastIndexOf('\n', ls - 2) + 1; return moveTo(Math.min(ps + col, ls - 1)); }
    const le = v.indexOf('\n', a); if (le < 0) return moveTo(v.length); const ne = v.indexOf('\n', le + 1); return moveTo(Math.min(le + 1 + col, ne < 0 ? v.length : ne));
  }
  if (k === 'ops'){ S.lpage = 'ops'; drawLpad(); return; }
  if (k.startsWith('op:')){
    const w = k.slice(3), v = ta.value;
    put(((a > 0 && !/\s/.test(v[a - 1])) ? ' ' : '') + w + (/[ \n]/.test(v[a] || '') ? '' : ' '));
    S.lpage = 'hex'; drawLpad(); ta.focus({preventScroll:true}); ta.dispatchEvent(new Event('input')); return;
  }
  if (k === 'bs'){ if (a === b && a > 0) a--; put(''); }
  else if (/^[0-9A-F]$/.test(k)){
    // 直前に2桁や名前がそろっていたら、先に空白を入れる
    if (a === b && /(^|\s)([0-9A-Fa-f]{2}|[:@][a-z])$/.test(ta.value.slice(0, a))) put(' ');
    put(k);
    const v = ta.value;
    // 2桁そろったら空白を入れる（すぐ後ろが空白・改行なら入れない）
    if (/[0-9A-F]{2}$/.test(v.slice(0, a)) && !/[0-9A-Fa-f:@]/.test(v[a - 3] || ' ') && !/[0-9A-Fa-f \n]/.test(v[a] || '')) put(' ');
  } else if (/^[a-z]$/.test(k)){
    put(k);
    if (/[:@]/.test(ta.value[a - 2] || '') && !/[ \n]/.test(ta.value[a] || '')) put(' ');
    S.lpage = 'hex'; drawLpad();
  } else if (k === ':' || k === '@'){ put(k); S.lpage = 'abc'; drawLpad(); }
  else if (k === '#'){ put('# '); if (!S.nativeKb) lkey('kb'); }
  else if (k === '\n'){ if (a === b && ta.value[a - 1] === ' ') a--; put('\n'); }
  else put(k);
  ta.focus({preventScroll:true});
  ta.dispatchEvent(new Event('input'));
}
function drawBuilt(){
  const el = document.getElementById('built'); if (!el) return;
  if (!S.built) S.built = buildCur();
  const B = S.built;
  if (B.errors){ el.innerHTML = B.errors.slice(0, 6).map(e => `<div class="msg err">✗ ${esc(e)}</div>`).join(''); return; }
  const midHTML = B.mid ? `<div class="msg dim" style="margin-bottom:6px">アセンブラの出力（ラベル付き16進）</div><div class="strip mono" style="margin:0 0 8px;font-size:12px">${esc(B.mid)}</div><div class="msg dim" style="margin-bottom:6px">ラベル翻訳機の出力（機械語）</div>` : '';
  el.innerHTML = midHTML + gridHTML(B.bytes, {cur:S.selAddr ?? -1, vm:S.vm && S.vm.steps ? S.vm : null, edit:false, labels:B.labels}) +
    (B.labels && Object.keys(B.labels).length ? `<div class="msg dim">名前：${Object.keys(B.labels).sort().map(k => `<span class="mono" style="color:var(--blue)">${k}</span>=${hex2(B.labels[k])}`).join('　')}</div>` : '') +
    `<div class="msg dim">${B.bytes.length} バイト　/ ${B.mid ? '2つの翻訳機で合わせて' : '翻訳機は'} ${B.steps} 歩で翻訳</div>` +
    (B.warn ? `<div class="msg warn">⚠ ${B.warn}</div>` : '');
}
function ensureVM(){
  if (!S.vm){ const b = curBytes(); if (!b) return null; S.vm = newVM(b, S.p.tests[S.ti].tape); }
  return S.vm;
}
// 名前の表（61〜7A 番地）のうち、このテープで :x される名前だけを見せる
function tableHTML(v, t){
  if (!S.p.table) return '';
  const names = [];
  t.tape.forEach((c, i) => { if (c === 0x3A && t.tape[i + 1] >= 0x61 && t.tape[i + 1] <= 0x7A && !names.includes(t.tape[i + 1])) names.push(t.tape[i + 1]); });
  if (!names.length) return '';
  return `<div class="strip"><span class="lbl">名前の表</span>${names.sort((a, b) => a - b).map(c => `<span class="t">${String.fromCharCode(c)}<span class="dim">[${hex2(c)}]</span>=${hex2(v.mem[c])}</span>`).join('　')}</div>`;
}
function drawMach(){
  const el = document.getElementById('mach'); if (!el) return;
  const v = ensureVM();
  if (!v){ el.innerHTML = '<div class="msg err">翻訳できないので動かせません。</div>'; return; }
  const t = S.p.tests[S.ti];
  const status = v.err ? `<span style="color:var(--red)">エラー</span>` : v.halted ? '<span style="color:var(--acc)">停止</span>' : v.steps ? '実行中' : '待機';
  const o = OP[v.mem[v.pc]];
  const next = v.halted || v.err ? '—' : o ? o.m + (o.arg ? ' ' + hex2(v.mem[(v.pc + 1) & 255]) : '') : '??';
  const tape = t.tape.length ? t.tape.map((c, i) => `<span class="t ${i === v.tp ? 'now' : i < v.tp ? 'used' : ''}">${TAPE_TEXT.has(S.p.id) ? esc(chOf(c)) : hex2(c)}</span>`).join('') + `<span class="t ${v.tp >= t.tape.length ? 'now' : ''}">■</span>` : '<span class="t now">■</span><span class="dim">（空）</span>';
  const outs = v.out.map((c, i) => `<span class="t ${t.out[i] === c ? '' : 'bad'}">${hex2(c)}</span>`).join(' ');
  el.innerHTML = `<div class="regs">

    <div>EQ <b>${v.eq ? '1' : '0'}</b> LT <b>${v.lt ? '1' : '0'}</b></div><div>歩数 <b>${v.steps}</b></div><div>${status}</div></div>
    <div class="strip"><span class="lbl">次</span>${next}${v.rs.length ? `　<span class="lbl">戻り先</span>${v.rs.map(hex2).join(' ')}` : ''}</div>
    <div class="strip"><span class="lbl">テープ #${S.ti + 1}</span>${tape}</div>${tableHTML(v, t)}

    ${v.err ? `<div class="msg err">✗ ${esc(v.err)}</div>` : ''}`;
  if (S.p.mode === 'hex') drawGrid(); else { drawBuilt(); drawSrcBg(); }
}
function drawResult(){
  const el = document.getElementById('result'); if (!el) return;
  el.innerHTML = S.msg ? `<div class="card"><div class="msg ${S.msg.cls}">${S.msg.html}</div></div>` : '';
}

/* ---------- 実行 ---------- */
function stopPlay(){ if (S.timer){ clearInterval(S.timer); S.timer = null; } const b = document.getElementById('playBtn'); if (b) b.textContent = '▶ 再生'; }
function doStep(n){
  const v = ensureVM(); if (!v) return;
  for (let i = 0; i < n && !v.halted && !v.err; i++){ step(v); if (v.steps >= STEP_LIMIT){ v.err = `${STEP_LIMIT}歩を超えても止まりません（無限ループ？）`; } }
  if (v.halted || v.err) stopPlay();
  drawMach();
}
function check(){
  stopPlay();
  const p = S.p, b = curBytes();
  if (!b){ S.msg = {cls:'err', html:'翻訳エラーを直してください。'}; drawResult(); document.getElementById('result').scrollIntoView({behavior:'smooth', block:'center'}); return; }
  S.results = p.tests.map(t => {
    const v = runVM(b, t.tape, STEP_LIMIT);
    const pass = !v.err && v.out.length === t.out.length && v.out.every((c, i) => c === t.out[i]);
    return {pass, v};
  });
  const bad = S.results.findIndex(r => !r.pass);
  drawTests();
  if (bad < 0){
    const steps = S.results.reduce((s, r) => s + r.v.steps, 0);
    const first = !SAVE.solved[p.id];
    SAVE.solved[p.id] = {size:b.length, steps};
    if (p.id === TR_ID) SAVE.translator = b.slice();
    if (p.id === ASM_ID) SAVE.assembler = b.slice();
    persist();
    S.msg = {cls:'ok', html:`✓ 全テスト通過　<span class="stats">${b.length} バイト / 合計 ${steps} 歩</span>`};
    drawResult();
    clearModal(p, b.length, steps, first);
  } else {
    const r = S.results[bad], t = p.tests[bad];
    let why = r.v.err ? esc(r.v.err) : `出力が違います。<br><span class="mono">期待 ${fmtBytes(t.out)}<br>実際 ${fmtBytes(r.v.out)}</span>`;
    S.msg = {cls:'err', html:`✗ テスト #${bad + 1} で失敗：${why}<br><small>テスト #${bad + 1} を機械に読み込みました。「1歩」で追いかけられます。</small>`};
    S.ti = bad; S.vm = null; drawAll();
    document.getElementById('result').scrollIntoView({behavior:'smooth', block:'center'});
  }
}

/* ---------- 編集（16進） ---------- */
function setCode(b, notes){ SAVE.code[S.p.id] = b; if (notes) SAVE.notes[S.p.id] = notes; persist(); S.vm = null; S.results = null; S.msg = null; stopPlay(); }
function pushUndo(){ S.undo.push({b:getCode(S.p).slice(), n:getNotes(S.p)}); if (S.undo.length > 200) S.undo.shift(); }
function key(d){
  const b = getCode(S.p).slice();
  if (S.cur > 255) return;
  if (S.pend === null){ S.pend = d; drawGrid(); return; }
  pushUndo();
  const nt0 = getNotes(S.p);
  while (b.length < S.cur){ b.push(0); nt0.push(''); }
  SAVE.notes[S.p.id] = nt0;
  b[S.cur] = parseInt(S.pend + d, 16); S.pend = null;
  const nt = getNotes(S.p); if (nt.length < b.length) nt.push('');
  setCode(b, nt); S.cur = Math.min(S.cur + 1, 255);
  drawAll();
}
function editOp(act){
  S.pend = null;
  const b = getCode(S.p).slice(), nt = getNotes(S.p);
  if (act === 'left') S.cur = Math.max(0, S.cur - 1);
  else if (act === 'right') S.cur = Math.min(S.cur + 1, 255);
  else if (act === 'ins'){ if (S.cur > b.length || b.length >= 256) return; pushUndo(); b.splice(S.cur, 0, 0); nt.splice(S.cur, 0, ''); setCode(b, nt); }
  else if (act === 'del'){ if (S.cur >= b.length) { if (S.cur > 0 && S.cur === b.length){ pushUndo(); b.pop(); nt.pop(); setCode(b, nt); S.cur--; } } else { pushUndo(); b.splice(S.cur, 1); nt.splice(S.cur, 1); setCode(b, nt); } }
  else if (act === 'bs'){ if (S.cur === 0) return; pushUndo(); b.splice(S.cur - 1, 1); nt.splice(S.cur - 1, 1); setCode(b, nt); S.cur--; }
  else if (act === 'undo'){ if (!S.undo.length) return; const u = S.undo.pop(); setCode(u.b, u.n); S.cur = Math.min(S.cur, getCode(S.p).length); }
  drawAll();
}

function serialize(b, nt){
  const lines = []; let cur = [];
  let note = '';
  const flush = () => { if (cur.length) lines.push(cur.join(' ') + (note ? '  # ' + note : '')); cur = []; note = ''; };
  b.forEach((x, i) => {
    if (nt[i] || cur.length >= 8) flush();
    if (nt[i]) note = nt[i];
    cur.push(hex2(x));
  });
  flush();
  return lines.join('\n');
}
function parseHexText(t){
  const b = [], nt = []; let pending = '';
  for (const line of t.split('\n')){
    const h = line.indexOf('#');
    const code = (h >= 0 ? line.slice(0, h) : line).replace(/\s+/g, '');
    const note = h >= 0 ? line.slice(h + 1).trim() : '';
    if (!/^([0-9a-fA-F]{2})*$/.test(code)) return {err:`16進の2桁ずつになっていません：「${line.trim()}」`};
    const start = b.length;
    (code.match(/../g) || []).forEach(x => { b.push(parseInt(x, 16)); nt.push(''); });
    // メモはその行の最初のバイトに付く（メモだけの行は次のバイトへ）
    if (b.length > start){ nt[start] = [pending, note].filter(Boolean).join(' / '); pending = ''; }
    else if (note) pending = [pending, note].filter(Boolean).join(' / ');
  }
  if (b.length > 256) return {err:'256 バイトを超えています'};
  return {b, nt};
}

function importCode(){
  const p = S.p, items = [];
  P.filter(q => q.mode === p.mode && q.id !== p.id && unlocked(q) && getCode(q).length).reverse()

  P.filter(q => q.mode === p.mode && q.id !== p.id && SAVE.solved[q.id] && SAMPLES[q.id]).reverse()
    .forEach(q => items.push({label:`${q.id} ${q.title}`, sub:'見本（一例）', sample:SAMPLES[q.id]}));

    else importText(title, it.sample || getCode(it.q));

// 第2段階：置き換えるか、末尾に足すか
// 第2段階：行の範囲を選んで、カーソル位置に差し込む（ぶつかるラベル名は付け替えられる）
function importText(title, c){
  const p = S.p, lines = c.split('\n');
  while (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();
  let a0 = 0, a1 = lines.length - 1, pickStart = true;
  const d = modal(`<h2>${esc(title)}</h2>
    <div id="tl" style="max-height:36vh;overflow:auto;font:13px/1.6 var(--mono);background:#0e150f;border-radius:8px;padding:6px 8px">
    ${lines.map((l, i) => `<div class="iline" data-i="${i}" style="cursor:pointer;border-radius:4px;padding:1px 4px;white-space:pre-wrap;overflow-wrap:anywhere"><span style="color:var(--dim)">${String(i + 1).padStart(2, ' ')}</span> ${esc(l) || ' '}</div>`).join('')}</div>
    <p style="font-size:13px;margin:8px 0 4px">行をタップすると範囲の始めに、もう一度別の行をタップすると終わりになります。</p>
    <div id="tsel" class="mono" style="font-size:13px"></div>
    <div id="tcol" style="font-size:13px;margin-top:6px"></div>
    <div class="row"><button data-close>やめる</button><button class="pri" id="tins">カーソル位置に差し込む</button><button id="tapp">末尾に足す</button><button class="amb" id="trep">全部置き換える</button></div>`);
  const cur = getCode(p);
  const defs = t => new Set([...t.split('\n').map(l => l.split('#')[0]).join('\n').matchAll(/:([a-z])(?![0-9a-zA-Z])/g)].map(m => m[1]));
  const refs = t => new Set([...t.split('\n').map(l => l.split('#')[0]).join('\n').matchAll(/@([a-z])(?![0-9a-zA-Z])/g)].map(m => m[1]));
  const snippet = () => lines.slice(a0, a1 + 1).join('\n');
  let rename = true;
  // 付け替え：貼る部分の中で、ぶつかる名前を空いている名前にそろえて変える
  const renamed = t => {
    const clash = [...defs(t)].filter(x => defs(cur).has(x));
    if (!rename || !clash.length) return t;
    const used = new Set([...defs(cur), ...refs(cur), ...defs(t), ...refs(t)]);
    const free = 'abcdefghijklmnopqrstuvwxyz'.split('').filter(x => !used.has(x));
    const map = {}; clash.forEach((x, i) => { if (free[i]) map[x] = free[i]; });
    return t.split('\n').map(l => { const h = l.indexOf('#'); const code = h >= 0 ? l.slice(0, h) : l, note = h >= 0 ? l.slice(h) : '';
      return code.replace(/([:@])([a-z])(?![0-9a-zA-Z])/g, (m, q, x) => q + (map[x] || x)) + note; }).join('\n');
  };
  const show = () => {
    d.querySelectorAll('.iline').forEach(el => el.classList.toggle('sel', +el.dataset.i >= a0 && +el.dataset.i <= a1));
    d.querySelector('#tsel').textContent = `${a0 + 1}〜${a1 + 1} 行目（${a1 - a0 + 1} 行）`;
    const t = snippet(), clash = [...defs(t)].filter(x => defs(cur).has(x));
    const outside = [...refs(t)].filter(x => !defs(t).has(x));
    let h = '';
    if (clash.length) h += `<label style="display:flex;gap:6px;align-items:flex-start"><input type="checkbox" id="tren" ${rename ? 'checked' : ''}> <span>名前 <b class="mono">${clash.join(' ')}</b> がいまのソースとぶつかります。差し込むとき、空いている名前に付け替える</span></label>`;
    if (outside.length) h += `<div class="dim">範囲の外の名前 <b class="mono">${outside.join(' ')}</b> を使っています。貼った先にも同じ名前が要ります。</div>`;
    d.querySelector('#tcol').innerHTML = h;
    const cb = d.querySelector('#tren'); if (cb) cb.onchange = () => { rename = cb.checked; };
  };
  d.querySelectorAll('.iline').forEach(el => el.onclick = () => {
    const i = +el.dataset.i;
    if (pickStart){ a0 = a1 = i; } else { if (i < a0) a0 = i; else a1 = i; }
    pickStart = !pickStart; show();
  });
  show();
  const put = v => { SAVE.code[p.id] = v; persist(); d.remove(); S.built = null; S.vm = null; renderPuzzle(); };
  d.querySelector('#trep').onclick = () => put(c);
  d.querySelector('#tapp').onclick = () => put(cur + (cur.endsWith('\n') || !cur ? '' : '\n') + renamed(snippet()) + '\n');
  d.querySelector('#tins').onclick = () => {
    let at = Math.min(S.caret ?? cur.length, cur.length);
    const ls = cur.lastIndexOf('\n', at - 1) + 1;
    if (at !== ls){ const le = cur.indexOf('\n', at); at = le < 0 ? cur.length : le + 1; }  // 行の途中なら次の行の頭へ
    let t = renamed(snippet()) + '\n';
    const before = cur.slice(0, at);
    if (before && !before.endsWith('\n')) t = '\n' + t;
    S.caret = at + t.length;
    put(before + t + cur.slice(at));
  };
}
// 16進：範囲を選んで、カーソル位置に上書き／挿入、または全部置き換え
function importRange(title, src, snt){
  // 行の区切り：メモのあるバイト、空き（00 が4つ以上続くところ）の始まりと終わり、16 バイトごと
  const pad = src.map(() => false);
  for (let i = 0; i < src.length;){ let j = i; while (j < src.length && src[j] === 0) j++; if (j - i >= 4) for (let k = i; k < j; k++) pad[k] = true; i = j > i ? j : i + 1; }
  const lines = []; let cur = null;
  src.forEach((x, i) => {
    if (!cur || snt[i] || pad[i] !== pad[i - 1] || cur.b.length >= 16){ cur = {at:i, b:[], note:snt[i] || '', pad:pad[i]}; lines.push(cur); }
    cur.b.push(hex2(x));
  });
  const d = modal(`<h2>${esc(title)}</h2>
    <div style="max-height:34vh;overflow:auto;font:13px/1.6 var(--mono);background:#0e150f;border-radius:8px;padding:6px 8px">
    ${lines.map(l => `<div class="iline" data-a="${l.at}" data-e="${l.at + l.b.length - 1}" style="cursor:pointer;border-radius:4px;padding:1px 4px"><span style="color:var(--dim)">${hex2(l.at)}:</span> ${l.pad ? `<span class="dim">00 の並び（空き ${l.b.length}バイト）</span>` : l.b.join(' ')}${l.note ? ` <span style="color:var(--amber)"># ${esc(l.note)}</span>` : ''}</div>`).join('')}</div>
    <p style="font-size:13px;margin:8px 0 4px">行をタップすると範囲の始めに、もう一度別の行をタップすると終わりになります。</p>
    <div style="display:flex;gap:8px;align-items:center;font-family:var(--mono)">
      <label>から <input id="ia" value="00" maxlength="2" style="width:3.2em;font:16px var(--mono);padding:4px;background:#0e150f;color:var(--fg);border:1px solid var(--line);border-radius:6px;text-transform:uppercase"></label>
      <label>まで <input id="ie" value="${hex2(src.length - 1)}" maxlength="2" style="width:3.2em;font:16px var(--mono);padding:4px;background:#0e150f;color:var(--fg);border:1px solid var(--line);border-radius:6px;text-transform:uppercase"></label>
      <span id="isz" class="dim" style="font-size:13px"></span>
    </div>
    <p class="dim" style="font-size:13px">貼る先：いまのカーソル <b class="mono" style="color:var(--amber)">${hex2(S.cur)}</b>番地から。別の番地に貼ると、持ってきた中の跳び先（JMP・JLT・CALL など）はずれます。貼った後に、跳ぶ命令をタップして確かめてください。</p>
    <div class="msg err" id="ierr"></div>
    <div class="row"><button data-close>やめる</button><button id="iover">${hex2(S.cur)}番地に上書き</button><button id="iins">${hex2(S.cur)}番地に挿入</button><button class="amb" id="irep">全部置き換える</button></div>`);
  const ia = d.querySelector('#ia'), ie = d.querySelector('#ie'), err = d.querySelector('#ierr');
  let pickStart = true;
  const range = () => {
    const a = parseInt(ia.value, 16), e = parseInt(ie.value, 16);
    if (!/^[0-9a-fA-F]{1,2}$/.test(ia.value) || !/^[0-9a-fA-F]{1,2}$/.test(ie.value) || a > e || e >= src.length){ return null; }
    return [a, e];
  };
  const show = () => {
    const r = range();
    d.querySelector('#isz').textContent = r ? `${r[1] - r[0] + 1} バイト` : '範囲が正しくありません';
    d.querySelectorAll('.iline').forEach(el => { const on = r && +el.dataset.a <= r[1] && +el.dataset.e >= r[0]; el.style.background = on ? '#2a2210' : ''; });
  };
  d.querySelectorAll('.iline').forEach(el => el.onclick = () => {
    if (pickStart){ ia.value = hex2(+el.dataset.a); ie.value = hex2(+el.dataset.e); }
    else { const a = parseInt(ia.value, 16); if (+el.dataset.a < a) ia.value = hex2(+el.dataset.a); else ie.value = hex2(+el.dataset.e); }
    pickStart = !pickStart; show();
  });
  ia.oninput = ie.oninput = show; show();
  const apply = mode => {
    const r = range(); if (!r){ err.textContent = '範囲を 00〜' + hex2(src.length - 1) + ' の中で、始め ≦ 終わり になるように入れてください'; return; }
    const pb = src.slice(r[0], r[1] + 1), pn = snt.slice(r[0], r[1] + 1);
    let b = getCode(S.p).slice(), nt = getNotes(S.p);
    if (mode === 'rep'){ b = src.slice(); nt = snt.slice(); }
    else {
      while (b.length < S.cur){ b.push(0); nt.push(''); }
      if (mode === 'ins'){ b.splice(S.cur, 0, ...pb); nt.splice(S.cur, 0, ...pn); }
      else pb.forEach((x, k) => { b[S.cur + k] = x; nt[S.cur + k] = pn[k] || nt[S.cur + k] || ''; });
    }
    if (b.length > 256){ err.textContent = `貼ると ${b.length} バイトになり、メモリ（256 バイト）に入りません`; return; }
    pushUndo(); setCode(b, nt); if (mode === 'rep') S.cur = 0; d.remove(); drawAll();
  };
  d.querySelector('#iover').onclick = () => apply('over');
  d.querySelector('#iins').onclick = () => apply('ins');
  d.querySelector('#irep').onclick = () => apply('rep');
}
function clearModal(p, size, steps, first){
  const next = P[P.indexOf(p) + 1];
  let body = `<h2>課題クリア</h2><p class="stats">${p.id} ${p.title}<br>${size} バイト ／ 合計 ${steps} 歩</p>`;
  if (p.after) body += `<div class="story">${p.after}</div>`;
  if (p.st === 1 && PARTS[p.id]){
    const left = Object.keys(PARTS).filter(id => !SAVE.solved[id]).length;
    body += `<p style="margin:10px 0 0">${first ? 'ラベル翻訳機に部品がはまった。' : ''}${left ? `完成まで、あと <b class="mono" style="color:var(--amber)">${left}</b> 個。` : '部品がすべてそろった。'}</p>` + blueprint(p.id, true);
  }
  if (p.st === 2 && PARTS2[p.id]){
    const left = Object.keys(PARTS2).filter(id => !SAVE.solved[id]).length;
    body += `<p style="margin:10px 0 0">${first ? 'アセンブラに部品がはまった。' : ''}${left ? `完成まで、あと <b class="mono" style="color:var(--amber)">${left}</b> 個。` : '部品がすべてそろった。'}</p>` + blueprint2(p.id, true);
  }
  if (p.id === ASM_ID){
    body += `<div class="unlock">▼ 段階解放 ▼<br>ニーモニック</div>
    <p>第3段階からは、命令を名前で書ける。あなたのアセンブラが番号に直し、あなたのラベル翻訳機が番地を数える。</p>
    <div class="story">16進で書いたラベル翻訳機が、ラベルで書いたアセンブラを機械語にした。そのアセンブラが、これからあなたの書く命令名を読む。道具が道具を作り、その道具がまた次を作る。</div>`;
  }
  if (p.id === TR_ID){
    body += `<div class="unlock">▼ 段階解放 ▼<br>ラベル付き16進</div>
    <p>あなたが一字一字、番地を数えて書いた ${size} バイト。これがあなたの最初の本格的な翻訳機だ。</p>
    <p>第2段階からのコードは、<b>この翻訳機</b>が機械語に直す。もう番地は数えなくていい。</p>
    <div class="story">この翻訳機は、あなたが書いた。だから信じられる。<br>……あなたが書いたものなら。</div>`;
  }
  if (p.id === END_ID){
    body += `<div class="unlock">試作版はここまで</div>
    <p>式を読んで計算できた。次は、式を読んで<b>計算する機械語を書き出す</b>——それがコンパイラだ。小さなCは、この電卓の延長にある。</p>
    <div class="story">道の先、廃墟のサーバに「完成品のCコンパイラ」のバイナリが残っているという噂がある。使えば、何段階も飛ばせる。<br>
    だが、そのコンパイラのソースに何も怪しいところがなくても——コンパイラ自身が、自分をコンパイルするたびに裏口を仕込み直していたら？<br>
    <span class="dim">（Ken Thompson「Reflections on Trusting Trust」1984）</span></div>`;
  }
  const nextOk = next && unlocked(next);
  body += `<div class="row"><button data-close>このまま</button>${nextOk ? `<button class="pri" id="gonext">次へ：${next.id} ${next.title}</button>` : `<button class="pri" id="gomap">地図へ</button>`}</div>`;
  const d = modal(body);
  const gn = d.querySelector('#gonext'); if (gn) gn.onclick = () => { d.remove(); go('puzzle', next.id); };
  const gm = d.querySelector('#gomap'); if (gm) gm.onclick = () => { d.remove(); go('map'); };
}

/* ---------- 入力 ---------- */
// キーパッドを押してもソース欄からカーソルが外れないようにする
app.addEventListener('pointerdown', e => { if (e.target.closest('#lpad button')) e.preventDefault(); });
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  switch (a){
    case 'title': go('title'); break;
    case 'map': go('map'); break;
    case 'manual': manual(); break;
    case 'open': go('puzzle', t.dataset.id); break;
    case 'exp': exportSave(); break;
    case 'imp': importSave(); break;
    case 'wipe':
      ask('すべての進み具合とコードを消して、最初からにしますか？', '消して最初から', () => { SAVE = {ver:3, code:{}, solved:{}, notes:{}, translator:null}; persist(); go('title'); });
      break;
    case 'k': key(t.dataset.k); break;
    case 'left': case 'right': case 'ins': case 'del': case 'undo': editOp(a); break;
    case 'cell': S.pend = null; S.cur = +t.dataset.i; drawGrid(); drawInfo(); break;
    case 'text': textEdit(); break;
    case 'memo': memoEdit(); break;
    case 'import': importCode(); break;
    case 'reset':
      ask('この課題のコードを初期状態に戻しますか？', '初期状態に戻す', () => {
        if (S.p.mode === 'hex'){ pushUndo(); delete SAVE.notes[S.p.id]; delete SAVE.code[S.p.id]; persist(); setCode(getCode(S.p).slice(), getNotes(S.p)); S.cur = 0; drawAll(); }
        else { delete SAVE.code[S.p.id]; persist(); S.built = null; S.vm = null; renderPuzzle(); }
      });
      break;
    case 'lk': lkey(t.dataset.k); break;
    case 'pick': stopPlay(); S.ti = +t.dataset.i; S.vm = null; drawTests(); drawMach(); break;
    case 'rst': stopPlay(); S.vm = null; drawMach(); break;
    case 'step': stopPlay(); doStep(1); break;
    case 'fin': stopPlay(); doStep(STEP_LIMIT); break;
    case 'play':
      if (S.timer){ stopPlay(); break; }
      { const v = ensureVM(); if (!v) break; if (v.halted || v.err){ S.vm = null; ensureVM(); } }
      t.textContent = '⏸ 停止';
      S.timer = setInterval(() => doStep(1), 140);
      break;
    case 'check': check(); break;
  }
});
document.addEventListener('keydown', e => {
  if (S.screen !== 'puzzle' || S.p.mode !== 'hex' || document.querySelector('.ov')) return;
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  const k = e.key;
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z'){ e.preventDefault(); editOp('undo'); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[0-9a-fA-F]$/.test(k)){ e.preventDefault(); key(k.toUpperCase()); }
  else if (k === 'ArrowLeft'){ e.preventDefault(); editOp('left'); }
  else if (k === 'ArrowRight' || k === ' '){ e.preventDefault(); editOp('right'); }
  else if (k === 'ArrowUp'){ e.preventDefault(); S.pend = null; S.cur = Math.max(0, S.cur - 8); drawGrid(); drawInfo(); }
  else if (k === 'ArrowDown'){ e.preventDefault(); S.pend = null; S.cur = Math.min(255, S.cur + 8); drawGrid(); drawInfo(); }
  else if (k === 'Backspace'){ e.preventDefault(); if (S.pend !== null){ S.pend = null; drawGrid(); } else editOp('bs'); }
  else if (k === 'Delete'){ e.preventDefault(); editOp('del'); }
  else if (k === 'Insert'){ e.preventDefault(); editOp('ins'); }
  else if (k === 'Enter'){ e.preventDefault(); check(); }
});

window.__boot = {build3, lint3, HASH, refAsmText, enc, dec, migrate, SAMPLES, P, PZ, runVM, asmTape, lint, build, SAVE: () => SAVE};
render();
cloudInit();
</script>
