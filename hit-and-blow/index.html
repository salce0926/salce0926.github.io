<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hit & Blow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <a class="back" href="../index.html">&larr; トップへ</a>

        <div class="title">HIT <span>&amp;</span> BLOW</div>
        <p class="sub">CPUと数当て勝負</p>

        <!-- 設定画面 -->
        <section id="setup" class="panel">
            <div class="setting">
                <label for="digitCount">桁数</label>
                <input type="number" id="digitCount" min="1" max="10" value="4">
            </div>
            <div class="setting">
                <label for="digitRange">使う数字</label>
                <span>0 〜</span>
                <input type="number" id="digitRange" min="1" max="9" value="9">
            </div>
            <ul class="rules">
                <li>おたがいに、同じ数字を使わない秘密の数を持っています。</li>
                <li>数字も場所も合っていたら <b class="h">HIT</b>、数字だけ合っていたら <b class="b">BLOW</b>。</li>
                <li>先に相手の数を当てた方の勝ちです。</li>
            </ul>
            <p id="setupError" class="error" role="alert"></p>
            <button id="startBtn" class="primary">ゲーム開始</button>
        </section>

        <!-- 対戦画面 -->
        <section id="game" hidden>
            <div class="secrets">
                <div class="secret">
                    <div class="label">CPUの答え</div>
                    <div id="cpuSecret" class="tiles"></div>
                </div>
                <div class="secret">
                    <div class="label">あなたの答え</div>
                    <div id="playerSecret" class="tiles"></div>
                </div>
            </div>

            <div id="banner" class="banner" hidden></div>

            <div class="boards">
                <div class="board-wrap">
                    <h2>あなたの推測</h2>
                    <div id="playerBoard" class="board"></div>
                    <div id="inputArea">
                        <div id="inputRow" class="row input-row"></div>
                        <p id="inputError" class="error" role="alert"></p>
                        <div id="keypad" class="keypad"></div>
                    </div>
                    <div id="endButtons" class="end-buttons" hidden>
                        <button id="againBtn" class="primary">もう一度</button>
                        <button id="settingsBtn">設定を変える</button>
                    </div>
                </div>

                <div class="board-wrap cpu">
                    <h2>CPUの推測 <span id="candidates" class="count"></span></h2>
                    <div id="cpuBoard" class="board"></div>
                    <details class="cpu-details">
                        <summary>CPUの考え</summary>
                        <div id="cpuProcess"></div>
                    </details>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
