<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SaltQuestⅠ</title>
    <link rel="stylesheet" href="styles/style.css?v=8">
</head>
<body>
    <div id="buttonContainer">
        <a href="../index.html" class="link">Return to main page</a>
        <a onclick="location.reload()" class="link">Play Again</a>
    </div>
    <canvas id="canvas"></canvas>
    <div id="game-info">
        <div id="point"></div>
        <div id="message">SaltQuestⅠ</div>
    </div>
    <!-- スマホ用の操作パネル。指で確実に押せるよう画面下の余白に置く -->
    <div id="pad">
        <div id="dpad">
            <button class="pk up"    data-key="ArrowUp"    aria-label="うえ"></button>
            <button class="pk left"  data-key="ArrowLeft"  aria-label="ひだり"></button>
            <button class="pk right" data-key="ArrowRight" aria-label="みぎ"></button>
            <button class="pk down"  data-key="ArrowDown"  aria-label="した"></button>
        </div>
        <div id="abGroup">
            <button id="btnB" class="pk" data-key="Escape" aria-label="キャンセル">B</button>
            <button id="btnA" class="pk" data-key=" " aria-label="けってい">A</button>
        </div>
        <!-- 開発用。押すと自動でレベル上げを始める（キーボードは a） -->
        <button id="btnAuto" class="pk" data-key="a" aria-label="オートレベルあげ">AUTO</button>
    </div>
    <!-- 更新時は ?v= を上げるとキャッシュが確実に飛ぶ -->
    <script src="scripts/mapdata.js?v=67"></script>
    <script src="scripts/data.js?v=67"></script>
    <script src="scripts/system.js?v=67"></script>
    <script src="scripts/battle.js?v=67"></script>
    <script src="scripts/event.js?v=67"></script>
</body>
</html>
