<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>イッシュン</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#0e0f16;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;image-rendering:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

/* ============================================================
   基盤：キャンバス / 入力 / 音 / 描画ヘルパ
   ============================================================ */

const W = 360, H = 640;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif';

// 遊技フィールド
const FX0 = 20, FX1 = 340, FY0 = 104, FY1 = 568;
const FW = FX1 - FX0, FH = FY1 - FY0;

// 色
const C = {
  bg:'#0e0f16', panel:'#191b26', line:'#2c2f40',
  ink:'#f2f3f8', dim:'#7a7f96',
  y:'#ffd23f', p:'#ff4d7d', c:'#37e0cf', v:'#8b6bff', g:'#5ce07a', o:'#ff8a3d'
};

let scale = 1, rect = null;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width  = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
  cv.width  = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  rect = null;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

/* ---------- 音 ---------- */
let AC = null, muted = (localStorage.getItem('isshun.mute') === '1');
function ac(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type, vol, delay){
  if (muted) return;
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.value = f;
  o.connect(g); g.connect(a.destination);
  const t = a.currentTime + (delay || 0);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol == null ? 0.05 : vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.start(t); o.stop(t + d + 0.03);
}
const SFX = {
  hit  : () => tone(760, 0.07, 'square', 0.05),
  pick : () => tone(520, 0.05, 'triangle', 0.05),
  clear: () => { tone(660,0.09,'square',0.055,0); tone(880,0.09,'square',0.055,0.08); tone(1180,0.16,'square',0.05,0.16); },
  fail : () => { tone(200,0.20,'sawtooth',0.05,0); tone(140,0.26,'sawtooth',0.05,0.08); },
  tick : () => tone(1500, 0.03, 'square', 0.028),
  level: () => { tone(520,0.08,'triangle',0.06,0); tone(700,0.08,'triangle',0.06,0.09); tone(980,0.2,'triangle',0.06,0.18); },
  over : () => { tone(420,0.18,'sawtooth',0.05,0); tone(310,0.2,'sawtooth',0.05,0.16); tone(200,0.5,'sawtooth',0.05,0.34); }
};
function buzz(ms){ if (navigator.vibrate) { try { navigator.vibrate(ms); } catch(e){} } }

/* ---------- 描画ヘルパ ---------- */
function rr(x, y, w, h, r){
  const m = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+m, y);
  ctx.arcTo(x+w, y,   x+w, y+h, m);
  ctx.arcTo(x+w, y+h, x,   y+h, m);
  ctx.arcTo(x,   y+h, x,   y,   m);
  ctx.arcTo(x,   y,   x+w, y,   m);
  ctx.closePath();
}
function fillRR(x,y,w,h,r,col){ rr(x,y,w,h,r); ctx.fillStyle = col; ctx.fill(); }
function strokeRR(x,y,w,h,r,col,lw){ rr(x,y,w,h,r); ctx.strokeStyle = col; ctx.lineWidth = lw||2; ctx.stroke(); }
function circle(x,y,r,col){ ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fillStyle = col; ctx.fill(); }
function ring(x,y,r,col,lw){ ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.strokeStyle = col; ctx.lineWidth = lw||3; ctx.stroke(); }
function text(s,x,y,size,col,align,weight){
  ctx.font = (weight||'bold') + ' ' + size + 'px ' + FONT;
  ctx.fillStyle = col; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function rnd(a,b){ return a + Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function dist(ax,ay,bx,by){ const dx=ax-bx, dy=ay-by; return Math.sqrt(dx*dx+dy*dy); }

/* ---------- パーティクル / 画面ゆれ ---------- */
const parts = [];
function burst(x, y, col, n){
  n = n || 10;
  for (let i=0;i<n;i++){
    const a = rnd(0, 6.2832), sp = rnd(60, 260);
    parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:rnd(0.3,0.6), max:0.6, col, r:rnd(2,5) });
  }
}
let shake = 0;
function updateParts(dt){
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 500*dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i,1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt*3.2);
}
function drawParts(){
  for (const p of parts){
    ctx.globalAlpha = clamp(p.life/p.max, 0, 1);
    circle(p.x, p.y, p.r, p.col);
  }
  ctx.globalAlpha = 1;
}

/* ---------- 玉あそび（ジャグリング）共通 ---------- */
const BALL_COLS = [C.y, C.c, C.p, C.v, C.o, C.g];
const BALL_R = 19;
const BX0 = 12, BX1 = 348;                       // 玉は通常のフィールドより広く使う
// 高さ h まで上がる初速（重力が変わっても跳ね方の感覚を揃える）
function bounceV(grav, h){ return -Math.sqrt(2*grav*h); }
/* 受け皿：指のx座標についてくる。玉は当たれば自動で跳ね上がる */
const PAD = { w:104, h:16, y: FY1-60 };
const PAD_FLOOR = FY1 - 8;
function mkPad(x, w){ return { x: x == null ? 180 : x, tx: x == null ? 180 : x, w: w || PAD.w }; }
function padStep(pad, dt, x0, x1){
  x0 = x0 == null ? BX0 : x0; x1 = x1 == null ? BX1 : x1;
  pad.x += (pad.tx - pad.x) * Math.min(1, dt*30);
  pad.x = clamp(pad.x, x0 + pad.w/2, x1 - pad.w/2);
}
function padCollide(list, pad, grav, h){
  const top = PAD.y - PAD.h/2;
  let n = 0;
  for (const b of list){
    if (b.vy <= 0) continue;
    // 1フレームで通り抜けないよう、線をまたいだかで判定する
    if (b.py + b.r <= top && b.y + b.r >= top &&
        Math.abs(b.x - pad.x) < pad.w/2 + b.r*0.8){
      b.y = top - b.r;
      b.vy = bounceV(grav, h);
      b.vx = clamp(b.vx*0.35 + (b.x - pad.x)*4.2, -170, 170);
      burst(b.x, top, b.col, 8); SFX.hit(); n++;
    }
  }
  return n;
}
function drawPad(pad){
  ctx.globalAlpha = 0.16;
  fillRR(pad.x-pad.w/2-7, PAD.y-PAD.h/2-5, pad.w+14, PAD.h+10, 14, C.c);
  ctx.globalAlpha = 1;
  fillRR(pad.x-pad.w/2, PAD.y-PAD.h/2, pad.w, PAD.h, 8, C.c);
}
/* 玉が同時に降ってこないように、周期内でいちばん空いている位相へ投入する。
   p = 受け皿の線に落ちてくるまでの秒数。p=0で着地、T/2で頂点、Tで打ち出し直後 */
function padLineY(r){ return PAD.y - PAD.h/2 - r; }
function phaseOf(b, grav, h){
  const T = 2*Math.sqrt(2*h/grav);
  const disc = b.vy*b.vy + 2*grav*(padLineY(b.r) - b.y);
  let t = disc <= 0 ? 0 : (-b.vy + Math.sqrt(disc)) / grav;
  if (!isFinite(t) || t < 0) t = 0;
  return ((t % T) + T) % T;
}
const TELE = 0.7;                                // 玉が出る前の予告時間
// 投入位置は、いま出ている玉からいちばん離れた横位置を選ぶ
function pickX(list, x0, x1){
  const m = Math.min(56, ((x1 == null ? BX1 : x1) - (x0 == null ? BX0 : x0))/2 - 20);
  const lo = (x0 == null ? BX0 : x0) + m, hi = (x1 == null ? BX1 : x1) - m;
  if (!list || !list.length) return rnd(lo, hi);
  let best = (lo+hi)/2, bs = -1;
  for (let k=0;k<=13;k++){
    const c = lo + (hi-lo)*k/13;
    let d = 1e9;
    for (const b of list) d = Math.min(d, Math.abs(c - b.x));
    if (d > bs){ bs = d; best = c; }
  }
  return best;
}
function mkPending(at, idx, list, x0, x1){ return { at, x: pickX(list, x0, x1), idx }; }
function drawPending(q, el, h){
  for (const e of q){
    const k = 1 - clamp((e.at - el)/TELE, 0, 1);
    if (k <= 0) continue;
    const y = PAD.y - PAD.h/2 - BALL_R - h*0.8;
    ctx.globalAlpha = 0.2 + k*0.55;
    ring(e.x, y, 26 + (1-k)*24, BALL_COLS[e.idx % BALL_COLS.length], 2);
    ctx.globalAlpha = 1;
  }
}
function spawnPhased(list, grav, h, idx, x){
  const v0 = -bounceV(grav, h), T = 2*v0/grav;
  // 投入位置は頂点付近だけに限る（真上に湧いて即落ちるのを防ぐ）
  const lo = T*0.50, hi = T*0.86;
  let p = T*0.72;
  if (list.length){
    const ph = list.map(b => phaseOf(b, grav, h));
    let bestScore = -1;
    for (let k=0;k<=48;k++){
      const c = lo + (hi-lo)*k/48;
      let m = 1e9;
      for (const q of ph){ let d = Math.abs(c-q); d = Math.min(d, T-d); if (d < m) m = d; }
      if (m > bestScore){ bestScore = m; p = c; }
    }
  }
  const r = BALL_R;
  const b = {
    x: x == null ? pickX(list) : x,
    y: clamp(padLineY(r) - (v0*p - 0.5*grav*p*p), FY0+r, padLineY(r)),
    vx: rnd(-28, 28), vy: v0 - grav*p, r, py: 0, age: 0,
    col: BALL_COLS[idx % BALL_COLS.length]
  };
  list.push(b);
  burst(b.x, b.y, b.col, 10);
  return b;
}
// 初期の玉は同時に出さず、周期を人数割りした間隔で1個ずつ投入する
function queueFor(n, grav, h, x0, x1){
  const T = 2*Math.sqrt(2*h/grav), q = [];
  const m = Math.min(56, ((x1 == null ? BX1 : x1) - (x0 == null ? BX0 : x0))/2 - 20);
  const lo = (x0 == null ? BX0 : x0) + m, hi = (x1 == null ? BX1 : x1) - m;
  for (let i=0;i<n;i++){
    const e = mkPending(i*(T/n), i, null, x0, x1);
    e.x = n > 1 ? lo + (hi-lo)*i/(n-1) : rnd(lo, hi);   // 初期ぶんは横に等間隔で置く
    q.push(e);
  }
  return q;
}
function drainQueue(s){
  while (s.q.length && s.el >= s.q[0].at){
    const e = s.q.shift();
    if (s.b.length < (s.max || 99)) spawnPhased(s.b, s.grav, s.h, e.idx, e.x);
  }
}
function drawFloor(){
  ctx.globalAlpha = 0.5;
  fillRR(BX0, PAD_FLOOR, BX1-BX0, 6, 3, C.p);
  ctx.globalAlpha = 1;
}
function ballStep(list, dt, grav, floor, pad, hitH, x0, x1){
  x0 = x0 == null ? BX0 : x0; x1 = x1 == null ? BX1 : x1;
  for (const b of list){
    b.py = b.y; b.age += dt;
    b.vy += grav*dt; b.x += b.vx*dt; b.y += b.vy*dt;
    if (b.x < x0+b.r){ b.x = x0+b.r; b.vx = Math.abs(b.vx); }
    if (b.x > x1-b.r){ b.x = x1-b.r; b.vx = -Math.abs(b.vx); }
    if (b.y < FY0+b.r){ b.y = FY0+b.r; b.vy = Math.abs(b.vy)*0.5; }
  }
  ballStep.caught = 0;
  if (pad){                                        // 受け皿は1つでも配列でもよい
    const pads = Array.isArray(pad) ? pad : [pad];
    for (const p of pads) ballStep.caught += padCollide(list, p, grav, hitH);
  }
  let dropped = null;
  for (const b of list) if (b.y + b.r > floor && !dropped) dropped = b;
  // 玉どうしが重ならないように軽く押し返す
  for (let i=0;i<list.length;i++) for (let j=i+1;j<list.length;j++){
    const a = list[i], b = list[j];
    const dx = b.x-a.x, dy = b.y-a.y, d = Math.sqrt(dx*dx+dy*dy) || 0.01;
    const ov = a.r + b.r - d;
    if (ov > 0){
      const nx = dx/d, ny = dy/d;
      a.x -= nx*ov/2; a.y -= ny*ov/2; b.x += nx*ov/2; b.y += ny*ov/2;
      const k = 28;                              // 弾きすぎると制御不能になるので弱く
      a.vx = clamp(a.vx - nx*k, -240, 240);
      b.vx = clamp(b.vx + nx*k, -240, 240);
    }
  }
  return dropped;
}
function drawBall(b){
  const k = clamp(b.age/0.3, 0, 1);            // 出てきた直後はふわっと出す
  if (k < 1) ring(b.x, b.y, b.r + 8 + (1-k)*26, b.col, 2);
  ctx.globalAlpha = 0.25 + k*0.75;
  circle(b.x, b.y, b.r, b.col);
  ctx.globalAlpha = 0.35*k; circle(b.x - b.r*0.3, b.y - b.r*0.34, b.r*0.27, '#fff');
  ctx.globalAlpha = 1;
  ring(b.x, b.y, b.r + 7, 'rgba(255,255,255,0.10)', 2);
}

/* ---------- 入力 ---------- */
const pointers = new Map();
function toLocal(e){
  if (!rect) rect = cv.getBoundingClientRect();
  return { x:(e.clientX - rect.left)/rect.width*W, y:(e.clientY - rect.top)/rect.height*H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); ac();
  if (!rect) rect = cv.getBoundingClientRect();
  const p = toLocal(e);
  pointers.set(e.pointerId, { x0:p.x, y0:p.y, x:p.x, y:p.y, t:performance.now(), moved:0 });
  onDown(p);
}, {passive:false});
cv.addEventListener('pointermove', e => {
  e.preventDefault();
  const d = pointers.get(e.pointerId); if (!d) return;
  const p = toLocal(e);
  d.moved = Math.max(d.moved, dist(p.x,p.y,d.x0,d.y0));
  d.x = p.x; d.y = p.y;
  onMove(p);
}, {passive:false});
function endPointer(e){
  e.preventDefault();
  const d = pointers.get(e.pointerId); if (!d) return;
  pointers.delete(e.pointerId);
  const p = toLocal(e);
  const held = (performance.now() - d.t)/1000;
  const dx = p.x - d.x0, dy = p.y - d.y0, dd = Math.sqrt(dx*dx+dy*dy);
  onUp(p, held);
  if (dd >= 34 && held < 0.6){
    const dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
    onSwipe(dir, p);
  } else if (d.moved < 22 && held < 0.45){
    onTap(p);
  }
}
cv.addEventListener('pointerup', endPointer, {passive:false});
cv.addEventListener('pointercancel', endPointer, {passive:false});
cv.addEventListener('contextmenu', e => e.preventDefault());
// PC用フォールバック
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const m = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if (m[e.key]) { e.preventDefault(); onSwipe(m[e.key], {x:W/2,y:H/2}); }
  else if (e.key === ' ') { e.preventDefault(); onDown({x:W/2,y:H/2}); onUp({x:W/2,y:H/2},0.05); onTap({x:W/2,y:H/2}); }
});

/* ============================================================
   ミニゲーム定義
   共通API: g.s(状態) g.lv(1-3) g.win() g.lose() g.t(残り) g.limit
   ============================================================ */

const GAMES = [];

/* 1. わる：出ている玉を全部タップ */
GAMES.push({
  key:'wari', word:'わる', ctrl:'タップ', time:4.2,
  init(g){
    const n = 2 + g.lv;
    const b = [];
    for (let i=0;i<n;i++){
      const r = rnd(24, 32);
      b.push({
        x: rnd(FX0+r+6, FX1-r-6), y: rnd(FY0+r+6, FY1-r-6),
        vx: rnd(-1,1)*(50+30*g.lv), vy: rnd(-1,1)*(50+30*g.lv),
        r, col: pick([C.y,C.p,C.c,C.v,C.o]), alive:true, pop:0
      });
    }
    g.s = { b };
  },
  update(dt,g){
    for (const o of g.s.b){
      if (!o.alive){ o.pop += dt; continue; }
      o.x += o.vx*dt; o.y += o.vy*dt;
      if (o.x < FX0+o.r){ o.x = FX0+o.r; o.vx *= -1; }
      if (o.x > FX1-o.r){ o.x = FX1-o.r; o.vx *= -1; }
      if (o.y < FY0+o.r){ o.y = FY0+o.r; o.vy *= -1; }
      if (o.y > FY1-o.r){ o.y = FY1-o.r; o.vy *= -1; }
    }
  },
  tap(p,g){
    for (const o of g.s.b){
      if (o.alive && dist(p.x,p.y,o.x,o.y) < o.r + 12){
        o.alive = false; burst(o.x,o.y,o.col,12); SFX.hit();
        if (g.s.b.every(z => !z.alive)) g.win();
        return;
      }
    }
  },
  draw(g){
    for (const o of g.s.b){
      if (!o.alive){
        const k = clamp(o.pop/0.25,0,1);
        ctx.globalAlpha = 1-k; ring(o.x,o.y,o.r+k*16,o.col,3); ctx.globalAlpha = 1;
        continue;
      }
      circle(o.x,o.y,o.r,o.col);
      ctx.globalAlpha = 0.35; circle(o.x-o.r*0.3,o.y-o.r*0.3,o.r*0.28,'#fff'); ctx.globalAlpha = 1;
    }
  }
});

/* 2. ためる：長押しでゲージを溜め、帯の中で離す */
GAMES.push({
  key:'tame', word:'ためる', ctrl:'ながおし', time:4.2,
  init(g){
    g.s = { v:0, held:false, target: rnd(0.45,0.82), band: 0.15 - 0.028*g.lv, rate: 0.40 + 0.06*g.lv, done:false, miss:0 };
  },
  update(dt,g){
    const s = g.s;
    if (s.miss > 0) s.miss -= dt;
    if (s.held && !s.done){
      s.v += s.rate*dt;
      if (s.v > 1.06){ s.done = true; g.lose(); }
    }
  },
  down(p,g){ if (!g.s.done) g.s.held = true; },
  up(p,d,g){
    const s = g.s; if (!s.held || s.done) return;
    s.held = false;
    // 勢いで一瞬押しただけのときは無効。やり直させる
    if (s.v < 0.15){ s.v = 0; s.miss = 0.7; tone(300,0.06,'triangle',0.04); return; }
    s.done = true;
    if (Math.abs(s.v - s.target) < s.band/2){ burst(180, FY1-40-FH*0.7*s.v, C.g, 16); g.win(); }
    else g.lose();
  },
  draw(g){
    const s = g.s;
    const bw = 96, bh = FH-110, bx = 180-bw/2, by = FY0+70;
    fillRR(bx,by,bw,bh,14,'#20222f');
    // 目標帯
    const ty = by + bh*(1 - clamp(s.target + s.band/2,0,1));
    const th = bh*s.band;
    fillRR(bx, ty, bw, th, 6, 'rgba(92,224,122,0.28)');
    strokeRR(bx, ty, bw, th, 6, C.g, 2);
    // 溜め
    const vh = bh*clamp(s.v,0,1);
    fillRR(bx+8, by+bh-vh, bw-16, vh, 8, s.v>1?C.p:C.y);
    text('ここで はなす', 180, ty - 18, 15, C.g);
    if (s.miss > 0){
      ctx.globalAlpha = clamp(s.miss/0.7, 0, 1);
      text('はやい！ もういちど', 180, by + bh + 26, 17, C.o);
      ctx.globalAlpha = 1;
    }
  }
});

function mixColor(hex, k){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const f = v => clamp(Math.round(v + (255-v)*(-k*0.9) + k*40), 0, 255);
  const h = v => v.toString(16).padStart(2,'0');
  return '#' + h(f(r)) + h(f(g)) + h(f(b));
}

/* ============================================================
   ゲーム進行
   ============================================================ */

const S = { TITLE:'title', INTRO:'intro', PLAY:'play', RESULT:'result', LEVEL:'level', OVER:'over', JUGGLE:'juggle', HOP:'hop', ONEOP:'oneop' };
const G = {
  state: S.TITLE, mode:'odai', t: 0, limit: 1,
  score: 0, lives: 4, speed: 1, lv: 1,
  mg: null, s: {}, ended: false, result: null,
  hist: [], flash: 0, banner: '', tickedAt: 99,
  bonusN: 0, bonusAt: -1, bonusMsg: '',
  sides: null, jt: 0, jlives: 3, jscore: 0, jrally: 0, jshard: 0, shards: [], shardNext: 0,
  hb: null, hpad: null, henemy: [], hshard: [], ht: 0, hscore: 0, hcharge: 0, hel: 0,
  w: null
};
let best  = parseInt(localStorage.getItem('isshun.best')  || '0', 10);
let bestJ = parseInt(localStorage.getItem('isshun.bestj') || '0', 10);
let bestH = parseInt(localStorage.getItem('isshun.besth') || '0', 10);
let bestW = parseInt(localStorage.getItem('isshun.bestw') || '0', 10);

G.win = function(){
  if (G.ended) return;
  G.ended = true; G.result = 'win'; G.score++;
  G.bonusMsg = '';
  if (G.mg.bonus){
    if (G.lives < 4){ G.lives++; G.bonusMsg = 'ライフ かいふく！'; }
    else { G.score += 2; G.bonusMsg = 'スコア ＋2'; }
  }
  SFX.clear(); buzz(18);
  G.state = S.RESULT; G.t = G.mg.bonus ? 1.2 : 0.72; G.flash = 1;
  if (G.score > best){ best = G.score; localStorage.setItem('isshun.best', String(best)); }
};
G.lose = function(){
  if (G.ended) return;
  G.ended = true; G.result = 'lose'; G.bonusMsg = '';
  if (G.mg.bonus){ G.bonusMsg = 'ボーナスは ライフが へらない'; }
  else G.lives--;
  SFX.fail(); buzz([30,40,60]); shake = 1;
  G.state = S.RESULT; G.t = G.mg.bonus ? 1.1 : 0.85;
};

function startGame(){
  G.mode = 'odai';
  G.score = 0; G.lives = 4; G.speed = 1; G.lv = 1; G.hist = [];
  G.bonusN = 0; G.bonusAt = -1; G.bonusMsg = '';
  parts.length = 0;
  nextRound();
}
function nextRound(){
  G.lv = clamp(1 + Math.floor(G.score / 7), 1, 3);
  G.speed = Math.min(2.1, 1 + G.score * 0.035);
  G.bonusMsg = '';

  let mg;
  if (G.score > 0 && G.score % 10 === 0 && G.bonusAt !== G.score){
    // 10クリアごとにボーナス面
    G.bonusAt = G.score; mg = BONUS;
  } else {
    let guard = 0; // 直近2種は避ける
    do { mg = pick(GAMES); guard++; } while (G.hist.indexOf(mg.key) >= 0 && guard < 30);
    G.hist.push(mg.key); if (G.hist.length > 2) G.hist.shift();
  }

  G.mg = mg; G.s = {}; G.ended = false; G.result = null;
  G.limit = mg.fixedTime ? mg.time : Math.max(mg.minTime || 0, mg.time / G.speed);
  mg.init(G);
  if (mg.bonus) G.bonusN++;
  G.state = S.INTRO;
  G.t = mg.bonus ? 1.3 : Math.max(0.5, 0.9 / G.speed);
  G.tickedAt = 99;
  tone(880, 0.05, 'triangle', 0.04);
}
function afterResult(){
  if (G.lives <= 0){
    G.state = S.OVER; G.t = 0; SFX.over(); return;
  }
  if (G.result === 'win' && !G.mg.bonus && G.score > 0 && G.score % 7 === 0){
    G.state = S.LEVEL; G.t = 1.1; G.banner = 'はやくなる'; SFX.level(); return;
  }
  nextRound();
}

/* ============================================================
   ジャグリング：受け皿が左右に1つずつ。玉は仕切りなしで行き来する
   スコアはラリー回数。かけらは得点だが、拾いに行くと落としやすい
   ============================================================ */
const JUG_H = 330, JUG_G0 = 420, JUG_LIVES = 3, JUG_MAX = 4;
const JUG_PADW = 78, JUG_PADMIN = 52;
const MIDX = 180;

function startJuggle(){
  G.mode = 'juggle'; G.state = S.JUGGLE;
  G.jt = 0; G.jlives = JUG_LIVES; G.jscore = 0; G.jrally = 0; G.jshard = 0;
  G.jgrav = JUG_G0; G.jnext = 14;
  G.pads = [ mkPad(96, JUG_PADW), mkPad(264, JUG_PADW) ];
  G.j = []; G.jq = queueFor(2, JUG_G0, JUG_H);
  G.shards = []; G.shardNext = 6;
  parts.length = 0;
  tone(880, 0.05, 'triangle', 0.04);
}
function updateJuggle(dt){
  G.jt += dt;
  G.jgrav = JUG_G0 + Math.min(170, G.jt*2.2);
  const padw = Math.max(JUG_PADMIN, JUG_PADW - G.jt*0.3);
  for (const p of G.pads) p.w = padw;

  // かけら：たまに落ちてくる。拾えば得点、落としても損はしない
  if (G.jt >= G.shardNext){
    G.shardNext = G.jt + rnd(7, 12);
    G.shards.push({ x: rnd(BX0+30, BX1-30), y: FY0, vy: 95 });
  }
  const top = PAD.y - PAD.h/2;
  for (let i=G.shards.length-1;i>=0;i--){
    const k = G.shards[i];
    k.y += k.vy*dt;
    if (k.y > PAD_FLOOR + 20){ G.shards.splice(i,1); continue; }
    for (const p of G.pads){
      if (Math.abs(k.y - top) < 16 && Math.abs(k.x - p.x) < p.w/2 + 12){
        G.shards.splice(i,1); G.jshard++; G.jscore += 50;
        burst(k.x, k.y, C.y, 16); SFX.pick();
        break;
      }
    }
  }

  // 玉の追加
  if (G.jt >= G.jnext){
    if (G.j.length + G.jq.length < JUG_MAX){ G.jq.push(mkPending(G.jt + TELE, G.j.length, G.j)); SFX.level(); }
    G.jnext += 14;
  }
  while (G.jq.length && G.jt >= G.jq[0].at){
    const e = G.jq.shift();
    if (G.j.length < JUG_MAX) spawnPhased(G.j, G.jgrav, JUG_H, e.idx, e.x);
  }

  // 受け皿は左右それぞれの持ち場のみ。玉は仕切りなしで全幅を行き来する
  padStep(G.pads[0], dt, BX0, MIDX);
  padStep(G.pads[1], dt, MIDX, BX1);
  const dropped = ballStep(G.j, dt, G.jgrav, PAD_FLOOR, G.pads, JUG_H);
  G.jrally += ballStep.caught; G.jscore += ballStep.caught * 10;
  if (!dropped) return;

  // 落とした玉は消える。ライフを1つ減らして、少し置いてから戻す
  G.j.splice(G.j.indexOf(dropped), 1);
  G.jlives--;
  burst(dropped.x, PAD_FLOOR, C.p, 20); SFX.fail(); buzz([30,40,60]);
  shake = 1; G.flash = 1;
  if (G.jlives > 0){ G.jq.push(mkPending(G.jt + 2.5, G.j.length, G.j)); return; }

  G.score = G.jscore;
  if (G.score > bestJ){ bestJ = G.score; localStorage.setItem('isshun.bestj', String(bestJ)); }
  G.state = S.OVER; G.t = 0;
  setTimeout(()=>SFX.over(), 220);
}
function drawJuggle(){
  fillRR(BX0, FY0, BX1-BX0, FY1-FY0, 10, '#141621');
  // 受け皿の持ち場の境目だけ、足元に薄く出す
  ctx.globalAlpha = 0.5;
  fillRR(MIDX-1, PAD.y-30, 2, 60, 1, '#2a2d3d');
  ctx.globalAlpha = 1;

  drawFloor();
  for (const p of G.pads) drawPad(p);
  drawPending(G.jq, G.jt, JUG_H);
  for (const b of G.j) drawBall(b);
  for (const k of G.shards){ ring(k.x, k.y, 13, C.y, 3); circle(k.x, k.y, 5, C.y); }

  text(String(G.jscore), 180, 40, 34, C.ink);
  for (let i=0;i<JUG_LIVES;i++) circle(28 + i*20, 34, 7, i < G.jlives ? C.p : '#242736');
  text('ラリー ' + G.jrally, 28, 62, 13, C.dim, 'left');
  text('さいこう ' + bestJ, 340, 40, 13, C.dim, 'right');
  text('かけら ' + G.jshard, 340, 62, 13, C.y, 'right');
  if (G.jt < 5){
    ctx.globalAlpha = clamp((5-G.jt)/1.5, 0, 1);
    text('左右を りょうての おやゆびで', 180, FY1+16, 14, C.c);
    ctx.globalAlpha = 1;
  }
}

/* ============================================================
   ワンオペ：別々の持ち場が同時に進行する。放っておくと崩れる
   ============================================================ */
const OP_BANDS = [ {y0:104,y1:252}, {y0:258,y1:406}, {y0:412,y1:560} ];
const OP_LIVES = 3;
function opPt(st){ G.w.score += 10; G.w.acts++; }

const OP_TYPES = {
  /* 落ちてくる玉を受け続ける */
  pad: {
    name:'おとすな', ctrl:'なぞる', col: C.c,
    init(st){
      st.padY = st.y1 - 16;
      st.pad = { x:180, tx:180, w: Math.max(68, 96 - st.lvl*5) };
      // 段が浅いぶん重力を落として、1往復に2秒以上かけさせる
      st.grav = 175 + 16*st.lvl;
      st.hh = (st.y1 - st.y0) - 58;
      // 横にほとんど流れない。一度その下に置けば、しばらく放っておける
      st.b = { x: rnd(BX0+60, BX1-60), y: st.padY - 20, vx: rnd(-12,12),
               vy: -Math.sqrt(2*st.grav*st.hh)*0.92, r: 13 };
    },
    update(dt, st){
      const b = st.b, py = st.padY, p = st.pad;
      p.x += (p.tx - p.x) * Math.min(1, dt*30);
      p.x = clamp(p.x, BX0 + p.w/2, BX1 - p.w/2);
      const prev = b.y;
      b.vy += st.grav*dt; b.x += b.vx*dt; b.y += b.vy*dt;
      if (b.x < BX0+b.r){ b.x = BX0+b.r; b.vx = Math.abs(b.vx); }
      if (b.x > BX1-b.r){ b.x = BX1-b.r; b.vx = -Math.abs(b.vx); }
      if (b.y < st.y0+b.r){ b.y = st.y0+b.r; b.vy = Math.abs(b.vy)*0.5; }
      if (b.vy > 0 && prev + b.r <= py && b.y + b.r >= py && Math.abs(b.x - p.x) < p.w/2 + b.r*0.8){
        b.y = py - b.r; b.vy = -Math.sqrt(2*st.grav*st.hh);
        b.vx = clamp(b.vx*0.3 + (b.x - p.x)*1.1, -55, 55);
        opPt(st); SFX.hit(); burst(b.x, py, C.c, 6);
      }
      st.warn = clamp((b.y - (st.y0 + (st.y1-st.y0)*0.5)) / ((st.y1-st.y0)*0.5), 0, 1);
      return b.y - b.r > st.y1;
    },
    down(p,st){ st.pad.tx = p.x; },
    move(p,st){ st.pad.tx = p.x; },
    draw(st){
      fillRR(st.pad.x - st.pad.w/2, st.padY - 6, st.pad.w, 12, 6, C.c);
      circle(st.b.x, st.b.y, st.b.r, C.y);
      ctx.globalAlpha = 0.3; fillRR(BX0+8, st.y1-3, BX1-BX0-16, 3, 2, C.p); ctx.globalAlpha = 1;
    }
  },

  /* ゲージが溢れる前に、帯の中でタップして戻す */
  gauge: {
    name:'ためる', ctrl:'タップ', col: C.y,
    init(st){
      st.v = 0; st.rate = 0.20 + 0.05*st.lvl;
      st.lo = 0.70; st.hi = 0.70 + Math.max(0.10, 0.20 - 0.03*st.lvl);
    },
    update(dt, st){
      st.v += st.rate*dt;
      st.warn = clamp(st.v, 0, 1);
      return st.v > 1;
    },
    tap(p, st){
      if (st.v >= st.lo && st.v <= st.hi){ opPt(st); burst(p.x, p.y, C.g, 12); SFX.pick(); }
      else { tone(300, 0.06, 'triangle', 0.04); }
      st.v = 0;
    },
    draw(st){
      const y = (st.y0+st.y1)/2, w = BX1-BX0-40, x = BX0+20;
      fillRR(x, y-16, w, 32, 16, '#1b1d29');
      fillRR(x + w*st.lo, y-16, w*(st.hi-st.lo), 32, 8, 'rgba(92,224,122,0.3)');
      fillRR(x+4, y-12, Math.max(0, (w-8)*clamp(st.v,0,1)), 24, 12, st.v > st.hi ? C.p : C.y);
      text('みどりで タップ', 180, y+34, 12, C.dim);
    }
  },

  /* 光ったマスを消す。全部光ると崩れる */
  lights: {
    name:'けす', ctrl:'タップ', col: C.o,
    init(st){
      st.n = 6; st.lit = new Array(6).fill(false);
      st.cd = 1.4; st.iv = Math.max(0.6, 1.7 - 0.25*st.lvl);
      st.lit[ri(0,5)] = true;
    },
    update(dt, st){
      st.cd -= dt;
      if (st.cd <= 0){
        st.cd = st.iv;
        const off = [];
        for (let i=0;i<st.n;i++) if (!st.lit[i]) off.push(i);
        if (off.length) st.lit[pick(off)] = true;
      }
      const c = st.lit.filter(Boolean).length;
      st.warn = c / st.n;
      return c >= st.n;
    },
    tap(p, st){
      const w = (BX1-BX0)/st.n;
      const i = clamp(Math.floor((p.x - BX0)/w), 0, st.n-1);
      if (st.lit[i]){ st.lit[i] = false; opPt(st); burst(BX0+w*(i+0.5), (st.y0+st.y1)/2, C.o, 10); SFX.hit(); }
    },
    draw(st){
      const w = (BX1-BX0)/st.n, y = (st.y0+st.y1)/2;
      for (let i=0;i<st.n;i++){
        const cx = BX0 + w*(i+0.5);
        if (st.lit[i]) fillRR(cx-w/2+4, y-30, w-8, 60, 12, C.o);
        else { fillRR(cx-w/2+4, y-30, w-8, 60, 12, '#1b1d29'); strokeRR(cx-w/2+4, y-30, w-8, 60, 12, '#262a3a', 2); }
      }
    }
  },

  /* 溜まる矢印を、向きどおりにスワイプして払う */
  arrows: {
    name:'はらう', ctrl:'スワイプ', col: C.v,
    init(st){
      st.q = ['left']; st.cd = 1.6; st.iv = Math.max(0.8, 2.0 - 0.28*st.lvl); st.max = 5;
    },
    update(dt, st){
      st.cd -= dt;
      if (st.cd <= 0){ st.cd = st.iv; st.q.push(pick(['left','right','up','down'])); }
      st.warn = st.q.length / st.max;
      return st.q.length >= st.max;
    },
    swipe(dir, st){
      if (st.q.length && dir === st.q[0]){
        st.q.shift(); opPt(st); burst(180, (st.y0+st.y1)/2, C.v, 10); SFX.pick();
      } else tone(300, 0.06, 'triangle', 0.04);
    },
    draw(st){
      const y = (st.y0+st.y1)/2;
      for (let i=0;i<st.q.length;i++){
        const x = 78 + i*52;
        ctx.globalAlpha = i === 0 ? 1 : 0.4;
        fillRR(x-24, y-24, 48, 48, 12, i===0 ? 'rgba(139,107,255,0.16)' : '#1b1d29');
        drawArrow(x, y, st.q[i], i===0 ? C.v : C.dim, 0.8);
        ctx.globalAlpha = 1;
      }
    }
  },

  /* 減り続けるバーを、連打で支える */
  bar: {
    name:'ささえる', ctrl:'れんだ', col: C.p,
    init(st){ st.v = 0.7; st.decay = 0.13 + 0.035*st.lvl; st.step = 0.055; st.k = 0; },
    update(dt, st){
      st.v -= st.decay*dt;
      if (st.k > 0) st.k -= dt*6;
      st.warn = clamp(1 - st.v, 0, 1);
      return st.v <= 0;
    },
    down(p, st){
      st.v = Math.min(1, st.v + st.step); st.k = 1;
      if (Math.random() < 0.34) opPt(st);
      SFX.hit();
    },
    draw(st){
      const y = (st.y0+st.y1)/2, w = BX1-BX0-40, x = BX0+20;
      fillRR(x, y-18, w, 36, 18, '#1b1d29');
      fillRR(x+5, y-13, Math.max(0,(w-10)*clamp(st.v,0,1)), 26, 13, st.v < 0.3 ? C.p : C.g);
      const sc = 1 + Math.max(0,st.k)*0.2;
      ctx.save(); ctx.translate(180, y-40); ctx.scale(sc,sc);
      text('れんだ', 0, 0, 15, C.dim); ctx.restore();
    }
  }
};
const OP_KEYS = Object.keys(OP_TYPES);

function opMake(band, key, lvl){
  const st = { y0: band.y0, y1: band.y1, key, lvl, warn: 0, flash: 0 };
  OP_TYPES[key].init(st);
  return st;
}
function startOneop(){
  G.mode = 'oneop'; G.state = S.ONEOP;
  const ks = OP_KEYS.slice().sort(()=>Math.random()-0.5);
  G.w = { t:0, lives:OP_LIVES, score:0, acts:0, lvl:0, nextAdd:16, nextLvl:14, nextSwap:26,
          sts: [ opMake(OP_BANDS[0], ks[0], 0), opMake(OP_BANDS[1], ks[1], 0) ] };
  parts.length = 0;
  tone(880, 0.05, 'triangle', 0.04);
}
function opFail(st){
  G.w.lives--;
  burst(180, (st.y0+st.y1)/2, C.p, 20); SFX.fail(); buzz([30,40,60]);
  shake = 1; G.flash = 1; st.flash = 1;
  OP_TYPES[st.key].init(st);                       // 持ち場は作り直して続行
  st.warn = 0;
  if (G.w.lives > 0) return;
  G.score = G.w.score;
  if (G.score > bestW){ bestW = G.score; localStorage.setItem('isshun.bestw', String(bestW)); }
  G.state = S.OVER; G.t = 0;
  setTimeout(()=>SFX.over(), 220);
}
function updateOneop(dt){
  const w = G.w;
  w.t += dt;

  if (w.t >= w.nextLvl){ w.nextLvl += 14; w.lvl++; SFX.level(); }
  // 3つ目の持ち場を足す
  if (w.t >= w.nextAdd && w.sts.length < 3){
    w.nextAdd = 1e9;
    const used = w.sts.map(s=>s.key);
    const k = pick(OP_KEYS.filter(x => used.indexOf(x) < 0)) || pick(OP_KEYS);
    w.sts.push(opMake(OP_BANDS[2], k, w.lvl));
    SFX.level(); G.flash = 0.6;
  }
  // 時々ひとつを別の持ち場に入れ替える
  if (w.t >= w.nextSwap){
    w.nextSwap += 26;
    const i = ri(0, w.sts.length-1);
    const used = w.sts.map(s=>s.key);
    const k = pick(OP_KEYS.filter(x => used.indexOf(x) < 0));
    if (k){ w.sts[i] = opMake(OP_BANDS[i], k, w.lvl); G.flash = 0.5; SFX.level(); }
  }

  for (const st of w.sts){
    st.lvl = w.lvl;
    if (st.flash > 0) st.flash -= dt*2;
    if (OP_TYPES[st.key].update(dt, st)){ opFail(st); if (G.state !== S.ONEOP) return; }
  }
}
function opAt(p){
  for (const st of G.w.sts) if (p.y >= st.y0 - 6 && p.y <= st.y1 + 6) return st;
  return null;
}
function drawOneop(){
  const w = G.w;
  for (const st of w.sts){
    const T = OP_TYPES[st.key];
    const danger = st.warn > 0.62;
    fillRR(BX0, st.y0, BX1-BX0, st.y1-st.y0, 12, danger ? '#20141c' : '#141621');
    if (danger){
      const a = 0.4 + Math.sin(performance.now()/90)*0.3;
      ctx.globalAlpha = clamp(a,0,1);
      strokeRR(BX0, st.y0, BX1-BX0, st.y1-st.y0, 12, C.p, 3);
      ctx.globalAlpha = 1;
    } else strokeRR(BX0, st.y0, BX1-BX0, st.y1-st.y0, 12, '#20232f', 2);
    if (st.flash > 0){
      ctx.globalAlpha = clamp(st.flash,0,1)*0.3;
      fillRR(BX0, st.y0, BX1-BX0, st.y1-st.y0, 12, C.p);
      ctx.globalAlpha = 1;
    }
    T.draw(st);
    text(T.name, BX0+14, st.y0+15, 12, danger ? C.p : C.dim, 'left');
    text(T.ctrl, BX1-14, st.y0+15, 11, C.dim, 'right');
    // 崩れ具合
    fillRR(BX0+10, st.y0+24, BX1-BX0-20, 3, 2, '#20232f');
    fillRR(BX0+10, st.y0+24, (BX1-BX0-20)*clamp(st.warn,0,1), 3, 2, danger ? C.p : T.col);
  }
  text(String(w.score), 180, 40, 32, C.ink);
  for (let i=0;i<OP_LIVES;i++) circle(28 + i*20, 34, 7, i < w.lives ? C.p : '#242736');
  text(w.t.toFixed(0) + ' びょう', 28, 62, 12, C.dim, 'left');
  text('さいこう ' + bestW, 340, 40, 13, C.dim, 'right');
  text('もちば ' + w.sts.length, 340, 62, 12, C.dim, 'right');
}

/* ============================================================
   ホッピング：受けて上に飛ばす。上の敵とかけらで時間が増減する
   ============================================================ */
// 通常バウンドは低く、上の段（かけら・敵）は大ジャンプでしか届かない
const HOP_H = 170, HOP_BIG = 360, HOP_T0 = 20, HOP_TMAX = 30;
// 通常バウンドの頂点は y=311。敵はそれより十分上に置き、通常では当たらないようにする
const HOP_EY = [190, 258], HOP_SY = [290, 225, 158];
function startHop(){
  G.mode = 'hop'; G.state = S.HOP;
  G.ht = HOP_T0; G.hscore = 0; G.hcatch = 0; G.hstomp = 0; G.hel = 0;
  G.hpad = mkPad(180, 96);
  G.hb = [];
  spawnPhased(G.hb, 620, HOP_H, 1);
  G.hgrav = 620; G.hcharge = 0;
  G.henemy = []; G.hshard = [];
  HOP_EY.forEach((y,i) => G.henemy.push({ x: rnd(BX0+40, BX1-40), y, vx: (i%2?1:-1)*(56+i*18), r: 17, cd: 0 }));
  HOP_SY.forEach((y,i) => G.hshard.push({ x: rnd(BX0+40, BX1-40), y, on:true, t:0 }));
  parts.length = 0;
  tone(880, 0.05, 'triangle', 0.04);
}
function hopEnd(){
  G.score = G.hscore;
  if (G.score > bestH){ bestH = G.score; localStorage.setItem('isshun.besth', String(bestH)); }
  G.state = S.OVER; G.t = 0;
  setTimeout(()=>SFX.over(), 220);
}
function updateHop(dt){
  G.hel += dt;
  G.ht -= dt;
  if (G.hcharge > 0) G.hcharge -= dt;
  if (G.ht <= 0){ G.ht = 0; hopEnd(); return; }

  // 敵は左右に往復する
  for (const e of G.henemy){
    e.x += e.vx*dt;
    if (e.cd > 0) e.cd -= dt;
    if (e.x < BX0+e.r){ e.x = BX0+e.r; e.vx = Math.abs(e.vx); }
    if (e.x > BX1-e.r){ e.x = BX1-e.r; e.vx = -Math.abs(e.vx); }
  }
  for (const k of G.hshard){ if (!k.on){ k.t -= dt; if (k.t <= 0){ k.on = true; k.x = rnd(BX0+40, BX1-40); } } }

  padStep(G.hpad, dt);
  const b = G.hb[0];
  if (!b) return;

  // 受ける瞬間に叩くと大ジャンプ（上のかけらまで届く）
  const hitH = G.hcharge > 0 ? HOP_BIG : HOP_H;
  const dropped = ballStep(G.hb, dt, G.hgrav, PAD_FLOOR, G.hpad, hitH);
  if (ballStep.caught){
    G.hcatch++; G.hscore += 5;
    if (G.hcharge > 0){ G.ht = Math.min(HOP_TMAX, G.ht + 1.0); G.hcharge = 0; G.flash = 0.6; SFX.level(); }
    else G.ht = Math.min(HOP_TMAX, G.ht + 0.4);
  }

  // 上の敵：下から当たると時間を失い、上から踏むと得する
  for (const e of G.henemy){
    if (e.cd > 0) continue;
    if (dist(b.x, b.y, e.x, e.y) < b.r + e.r){
      e.cd = 0.5;
      if (b.vy > 0){                                   // 落ちながら踏んだ
        b.vy = bounceV(G.hgrav, 200); G.hstomp++;
        G.ht = Math.min(HOP_TMAX, G.ht + 0.8); G.hscore += 20;
        burst(e.x, e.y, C.g, 14); SFX.hit();
        e.x = rnd(BX0+40, BX1-40); e.vx = -e.vx;
      } else {                                          // 下からぶつかった
        b.vy = Math.abs(b.vy)*0.5; G.ht -= 2.5;
        burst(b.x, b.y, C.p, 16); SFX.fail(); buzz(40); shake = 0.8;
      }
    }
  }
  for (const k of G.hshard){
    if (k.on && dist(b.x, b.y, k.x, k.y) < b.r + 14){
      k.on = false; k.t = rnd(3, 6);
      G.ht = Math.min(HOP_TMAX, G.ht + 1.5); G.hscore += 30;
      burst(k.x, k.y, C.y, 16); SFX.pick();
    }
  }

  if (dropped){
    G.hb.length = 0;
    G.ht -= 5;
    burst(dropped.x, PAD_FLOOR, C.p, 20); SFX.fail(); buzz([30,40,60]); shake = 1; G.flash = 1;
    if (G.ht <= 0){ G.ht = 0; hopEnd(); return; }
    spawnPhased(G.hb, G.hgrav, HOP_H, 1);
  }
}
function drawHop(){
  for (const e of G.henemy){
    fillRR(e.x-e.r, e.y-e.r*0.8, e.r*2, e.r*1.6, 6, C.p);
    circle(e.x - 5, e.y - 3, 2.5, '#141520'); circle(e.x + 5, e.y - 3, 2.5, '#141520');
  }
  for (const k of G.hshard){
    if (!k.on) continue;
    ring(k.x, k.y, 13, C.y, 3); circle(k.x, k.y, 5, C.y);
  }
  drawFloor();
  drawPad(G.hpad);
  for (const b of G.hb) drawBall(b);

  // 大ジャンプの構え
  if (G.hcharge > 0){
    const top = PAD.y - PAD.h/2;
    ctx.globalAlpha = clamp(G.hcharge/0.25, 0, 1);
    ring(G.hpad.x, top, 30 + (1-clamp(G.hcharge/0.25,0,1))*16, C.y, 3);
    ctx.globalAlpha = 1;
  }

  // 残り時間
  const w = 176, k = clamp(G.ht/HOP_TMAX, 0, 1);
  fillRR(180-w/2, 26, w, 14, 7, '#1b1d29');
  fillRR(180-w/2, 26, w*k, 14, 7, G.ht < 6 ? C.p : C.c);
  text(G.ht.toFixed(1), 180, 58, 18, G.ht < 6 ? C.p : C.ink);
  text(String(G.hscore), 28, 34, 22, C.y, 'left');
  text('さいこう ' + bestH, 340, 34, 13, C.dim, 'right');
  if (G.hel < 5){
    ctx.globalAlpha = clamp((5-G.hel)/1.5, 0, 1);
    text('うける しゅんかんに たたくと 大ジャンプ', 180, FY1+16, 13, C.c);
    ctx.globalAlpha = 1;
  }
}

/* ---------- 入力ルーティング ---------- */
function jugPad(p){ return p.x < MIDX ? G.pads[0] : G.pads[1]; }
function onDown(p){
  if (G.state === S.JUGGLE){ jugPad(p).tx = p.x; return; }
  if (G.state === S.HOP){
    // 指を置いた瞬間に大ジャンプの構えになる。別の指で叩いても、置き直しても効く
    G.hcharge = 0.28;
    if (pointers.size <= 1) G.hpad.tx = p.x;
    return;
  }
  if (G.state === S.ONEOP){
    const st = opAt(p); if (st && OP_TYPES[st.key].down) OP_TYPES[st.key].down(p, st);
    return;
  }
  if (G.state === S.PLAY && !G.ended && G.mg.down) G.mg.down(p, G);
}
function onMove(p){
  if (G.state === S.JUGGLE){ jugPad(p).tx = p.x; return; }
  if (G.state === S.HOP){ G.hpad.tx = p.x; return; }
  if (G.state === S.ONEOP){
    const st = opAt(p); if (st && OP_TYPES[st.key].move) OP_TYPES[st.key].move(p, st);
    return;
  }
  if (G.state === S.PLAY && !G.ended && G.mg.move) G.mg.move(p, G);
}
function onUp(p, held){
  if (G.state === S.PLAY && !G.ended && G.mg.up) G.mg.up(p, held, G);
}
// タイトルのボタン領域
const BTN_A = { x:180, y:242, w:252, h:56 };   // おだい
const BTN_D = { x:180, y:324, w:252, h:56 };   // ワンオペ
const BTN_B = { x:180, y:406, w:252, h:56 };   // ジャグリング
const BTN_C = { x:180, y:488, w:252, h:56 };   // ホッピング
const BTN_M = { x:326, y:40,  w:52,  h:44 };   // 音
function inBtn(p, b){ return Math.abs(p.x-b.x) < b.w/2 && Math.abs(p.y-b.y) < b.h/2; }

function onTap(p){
  if (G.state === S.TITLE){
    if (inBtn(p, BTN_M)){ muted = !muted; localStorage.setItem('isshun.mute', muted?'1':'0'); return; }
    if (inBtn(p, BTN_C)){ startHop(); return; }
    if (inBtn(p, BTN_B)){ startJuggle(); return; }
    if (inBtn(p, BTN_D)){ startOneop(); return; }
    if (inBtn(p, BTN_A)){ startGame(); return; }
    return;
  }
  if (G.state === S.OVER){
    if (G.t <= 0.7) return;
    if (p.y > 566){ G.state = S.TITLE; return; }        // タイトルへ
    if (G.mode === 'juggle') startJuggle();
    else if (G.mode === 'hop') startHop();
    else if (G.mode === 'oneop') startOneop();
    else startGame();
    return;
  }
  if (G.state === S.ONEOP){
    const st = opAt(p); if (st && OP_TYPES[st.key].tap) OP_TYPES[st.key].tap(p, st);
    return;
  }
  if (G.state === S.PLAY && !G.ended && G.mg.tap) G.mg.tap(p, G);
}
function onSwipe(dir, p){
  if (G.state === S.ONEOP){
    const st = opAt(p); if (st && OP_TYPES[st.key].swipe) OP_TYPES[st.key].swipe(dir, st);
    return;
  }
  if (G.state === S.PLAY && !G.ended && G.mg.swipe) G.mg.swipe(dir, G);
}

/* ---------- 更新 ---------- */
function update(dt){
  updateParts(dt);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt*3);

  if (G.state === S.INTRO){
    G.t -= dt;
    if (G.t <= 0){ G.state = S.PLAY; G.t = G.limit; }
  } else if (G.state === S.PLAY){
    G.t -= dt;
    if (G.mg.update) G.mg.update(dt, G);
    if (!G.ended){
      const left = Math.ceil(G.t);
      if (G.t <= 3 && left !== G.tickedAt && left >= 1){ G.tickedAt = left; SFX.tick(); }
      if (G.t <= 0){ if (G.mg.timeoutWin) G.win(); else G.lose(); }
    }
  } else if (G.state === S.RESULT){
    G.t -= dt;
    if (G.mg && G.mg.update && G.result === 'win' && G.mg.timeoutWin) { /* 静止 */ }
    if (G.t <= 0) afterResult();
  } else if (G.state === S.LEVEL){
    G.t -= dt;
    if (G.t <= 0) nextRound();
  } else if (G.state === S.JUGGLE){
    updateJuggle(dt);
  } else if (G.state === S.HOP){
    updateHop(dt);
  } else if (G.state === S.ONEOP){
    updateOneop(dt);
  } else if (G.state === S.OVER){
    G.t += dt;
  }
}

/* ---------- 描画 ---------- */
function drawBG(){
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = '#151724'; ctx.lineWidth = 1;
  for (let y = 0; y < H; y += 32){ ctx.beginPath(); ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); ctx.stroke(); }
  ctx.globalAlpha = 1;
}
function drawHUD(){
  // ハート
  for (let i=0;i<4;i++){
    const x = 22 + i*22, y = 34;
    const on = i < G.lives;
    circle(x, y, 8, on ? C.p : '#242736');
  }
  text(String(G.score), 338, 34, 26, C.ink, 'right');
  text('LV' + G.lv, 338, 58, 12, C.dim, 'right');

  // 制限時間バー
  const bx = 20, by = 74, bw = 320, bh = 10;
  fillRR(bx, by, bw, bh, 5, '#1b1d29');
  if (G.state === S.PLAY || G.state === S.RESULT){
    const k = G.state === S.PLAY ? clamp(G.t/G.limit, 0, 1) : (G.result==='win'?0.0:0);
    const col = k < 0.25 ? C.p : (k < 0.55 ? C.o : C.c);
    if (k > 0) fillRR(bx, by, bw*k, bh, 5, col);
  }
  // お題（小）
  if (G.mg && (G.state === S.PLAY || G.state === S.RESULT)){
    text(G.mg.word, 180, 34, 22, C.ink);
    text(G.mg.ctrl, 180, 58, 12, C.dim);
  }
}
function drawIntro(){
  const full = G.mg.bonus ? 1.3 : Math.max(0.5, 0.9/G.speed);
  const k = 1 - clamp(G.t / full, 0, 1);
  const sc = 0.7 + Math.min(1, k*2.4)*0.35;
  if (G.mg.bonus){
    const a = 0.5 + Math.sin(performance.now()/120)*0.5;
    ctx.globalAlpha = 0.5 + a*0.5;
    text('ボーナス', 180, FY0 + FH/2 - 92, 26, C.y);
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.translate(180, FY0 + FH/2 - 20);
  ctx.scale(sc, sc);
  text(G.mg.word, 0, 0, 56, G.mg.bonus ? C.y : C.ink);
  ctx.restore();
  fillRR(180-62, FY0+FH/2+42, 124, 34, 17, '#1b1d29');
  text(G.mg.ctrl, 180, FY0+FH/2+59, 16, C.c);
  if (G.mg.bonus) text('ミスしても ライフは へらない', 180, FY0+FH/2+108, 14, C.dim);
}
function drawResult(){
  if (G.result === 'win'){
    ctx.globalAlpha = 0.85;
    ring(180, FY0+FH/2, 62, C.g, 9);
    ctx.globalAlpha = 1;
  } else {
    ctx.strokeStyle = C.p; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(180-44, FY0+FH/2-44); ctx.lineTo(180+44, FY0+FH/2+44);
    ctx.moveTo(180+44, FY0+FH/2-44); ctx.lineTo(180-44, FY0+FH/2+44);
    ctx.stroke();
  }
  if (G.bonusMsg){
    fillRR(180-116, FY0+FH/2+82, 232, 40, 20, '#1b1d29');
    text(G.bonusMsg, 180, FY0+FH/2+103, 16, G.result === 'win' ? C.y : C.dim);
  }
}
function drawTitle(){
  ctx.save();
  ctx.translate(180, 130);
  text('イッシュン', 0, 0, 46, C.ink);
  ctx.restore();
  text('ひまつぶし よっつ', 180, 170, 13, C.dim);

  const pulse = 1 + Math.sin(performance.now()/333)*0.035;
  ctx.save(); ctx.translate(BTN_A.x, BTN_A.y); ctx.scale(pulse,pulse);
  fillRR(-BTN_A.w/2, -BTN_A.h/2, BTN_A.w, BTN_A.h, 28, C.y);
  text('おだいを さばく', 0, 1, 21, '#141520');
  ctx.restore();
  text('5びょうの おだいが つぎつぎ来る　さいこう ' + best, 180, BTN_A.y + 41, 11, C.dim);

  const modes = [
    [BTN_D, 'ワンオペ', C.g, 'べつの もちばが 同時に すすむ', bestW],
    [BTN_B, 'ジャグリング', C.c, '左右を りょうての おやゆびで', bestJ],
    [BTN_C, 'ホッピング', C.o, 'うけて 上に とばす', bestH]
  ];
  for (const [b, label, col, cap, bs] of modes){
    fillRR(b.x-b.w/2, b.y-b.h/2, b.w, b.h, 28, '#1b1d29');
    strokeRR(b.x-b.w/2, b.y-b.h/2, b.w, b.h, 28, col, 2);
    text(label, b.x, b.y+1, 21, col);
    text(cap + '　さいこう ' + bs, 180, b.y + 41, 11, C.dim);
  }

  text('タップ / ながおし / スワイプ / なぞる', 180, 578, 11, C.dim);
  fillRR(BTN_M.x-BTN_M.w/2, BTN_M.y-BTN_M.h/2, BTN_M.w, BTN_M.h, 14, '#1b1d29');
  text(muted ? '🔇' : '🔊', BTN_M.x, BTN_M.y, 18, C.ink);
}
function drawOver(){
  const m = G.mode;
  const bb = m === 'juggle' ? bestJ : m === 'hop' ? bestH : m === 'oneop' ? bestW : best;
  const label = m === 'odai' ? 'クリアした かず' : 'スコア';
  ctx.fillStyle = 'rgba(14,15,22,0.86)'; ctx.fillRect(0,0,W,H);
  text('おわり', 180, 200, 40, C.p);
  text(label, 180, 276, 15, C.dim);
  text(String(G.score), 180, 322, 60, C.ink);
  if (m === 'juggle') text('ラリー ' + G.jrally + '　かけら ' + G.jshard, 180, 366, 14, C.dim);
  if (m === 'hop')    text('うけた ' + G.hcatch + '　ふんだ ' + G.hstomp, 180, 366, 14, C.dim);
  if (m === 'oneop')  text('もった じかん ' + G.w.t.toFixed(0) + 'びょう　さばいた ' + G.w.acts, 180, 366, 14, C.dim);
  text('さいこう記録  ' + bb, 180, 400, 16, G.score >= bb ? C.y : C.dim);
  if (G.score >= bb && G.score > 0) text('じこベスト！', 180, 432, 18, C.y);
  if (G.t > 0.7){
    const a = 0.6 + Math.sin(performance.now()/300)*0.4;
    ctx.globalAlpha = a;
    text('タップで もういちど', 180, 500, 20, C.ink);
    ctx.globalAlpha = 1;
    text('したを タップで タイトルへ', 180, 588, 13, C.dim);
  }
}

function render(){
  ctx.save();
  if (shake > 0){
    ctx.translate(rnd(-1,1)*shake*7, rnd(-1,1)*shake*7);
  }
  drawBG();

  if (G.state === S.TITLE){
    drawTitle();
  } else if (G.state === S.JUGGLE){
    drawJuggle();
    drawParts();
  } else if (G.state === S.HOP){
    drawHop();
    drawParts();
  } else if (G.state === S.ONEOP){
    drawOneop();
    drawParts();
  } else {
    if (G.state !== S.OVER) drawHUD();
    if (G.state === S.INTRO){
      drawIntro();
    } else if (G.state === S.PLAY || G.state === S.RESULT || G.state === S.LEVEL){
      if (G.mg && G.mg.draw) G.mg.draw(G);
      if (G.state === S.RESULT) drawResult();
      if (G.state === S.LEVEL){
        ctx.fillStyle = 'rgba(14,15,22,0.8)'; ctx.fillRect(0,0,W,H);
        const k = clamp((1.1 - G.t)/0.2, 0, 1);
        ctx.save(); ctx.translate(180, FY0+FH/2); ctx.scale(0.8+k*0.2, 0.8+k*0.2);
        text(G.banner, 0, 0, 44, C.y);
        ctx.restore();
        text('LV ' + clamp(1 + Math.floor(G.score/7), 1, 3), 180, FY0+FH/2+56, 20, C.c);
      }
    }
    drawParts();
    if (G.state === S.OVER) drawOver();
  }
  ctx.restore();

  if (G.flash > 0){
    ctx.globalAlpha = G.flash*0.16;
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }
}

/* ---------- ループ ---------- */
window.__isshun = { G, GAMES, BONUS, S, startGame, startJuggle, updateJuggle, startHop, updateHop, startOneop, updateOneop, OP_TYPES, OP_KEYS, nextRound }; // 動作確認用
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
