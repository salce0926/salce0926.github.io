<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Hit &amp; Blow thumbnail</title>
<!-- トップページのサムネイル用のイラスト。ゲーム画面が文字中心で映えないため、遊んでいる様子を絵にしている -->
<!-- 答え 5273 に対して、各行の Hit / Blow はルールどおりの値にしてある -->
<style>
    html, body { margin: 0; }
    #art {
        width: 1280px;
        height: 720px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 72px;
        background: radial-gradient(circle at 30% 20%, #23395d 0%, #142238 60%, #0e1829 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: #fff;
    }
    .title { font-size: 64px; font-weight: 800; letter-spacing: 0.04em; line-height: 1.05; }
    .title span { color: #ffb74d; }
    .sub { margin-top: 18px; font-size: 26px; color: #9fb3d1; }
    .secret { margin-top: 36px; display: flex; gap: 12px; }
    .secret div {
        width: 64px; height: 76px; border-radius: 12px;
        background: #0b1322; border: 2px dashed #4b6488;
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; font-weight: 800; color: #4b6488;
    }
    .board { display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .d {
        width: 76px; height: 84px; border-radius: 14px;
        background: #f4f7fb; color: #1d2b44;
        display: flex; align-items: center; justify-content: center;
        font-size: 48px; font-weight: 800;
        box-shadow: 0 4px 0 #b9c6d8;
    }
    .d.hit { background: #43a047; color: #fff; box-shadow: 0 4px 0 #2e7031; }
    .d.blow { background: #ffb74d; color: #3d2600; box-shadow: 0 4px 0 #c98a2c; }
    .res { margin-left: 18px; display: flex; gap: 8px; font-size: 26px; font-weight: 800; }
    .res b { padding: 6px 14px; border-radius: 999px; }
    .res .h { background: rgba(67, 160, 71, 0.22); color: #7ed683; }
    .res .b { background: rgba(255, 183, 77, 0.2); color: #ffc878; }
    .row.win .res .h { background: #43a047; color: #fff; }
</style>
</head>
<body>
<div id="art">
    <div>
        <div class="title">HIT<br><span>&amp;</span> BLOW</div>
        <div class="sub">CPUと数当て勝負</div>
        <div class="secret"><div>?</div><div>?</div><div>?</div><div>?</div></div>
    </div>
    <div class="board">
        <div class="row"><div class="d">1</div><div class="d hit">2</div><div class="d blow">3</div><div class="d">4</div><div class="res"><b class="h">1 HIT</b><b class="b">1 BLOW</b></div></div>
        <div class="row"><div class="d hit">5</div><div class="d">6</div><div class="d hit">7</div><div class="d">8</div><div class="res"><b class="h">2 HIT</b><b class="b">0 BLOW</b></div></div>
        <div class="row"><div class="d hit">5</div><div class="d blow">7</div><div class="d blow">2</div><div class="d hit">3</div><div class="res"><b class="h">2 HIT</b><b class="b">2 BLOW</b></div></div>
        <div class="row win"><div class="d hit">5</div><div class="d hit">2</div><div class="d hit">7</div><div class="d hit">3</div><div class="res"><b class="h">4 HIT!</b></div></div>
    </div>
</div>
</body>
</html>
